<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>루미 v3 — 코어 부양 · 렌즈 아이</title>
<style>
  :root { --void:#0a0c0e; --steel:#14181c; --edge:#232a30; --dim:#6d7780; --read:#b9c2c9; --lens:#e8a33d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--void); color:var(--read);
         font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;
         font-size:14px; line-height:1.6; }
  .wrap { max-width:920px; margin:0 auto; padding:24px 20px 40px; }
  h1 { font-size:17px; font-weight:500; margin:0 0 2px; color:#e6ebef; letter-spacing:-.01em; }
  .sub { color:var(--dim); font-size:13px; margin:0 0 18px; }
  #stage { position:relative; height:520px; border:1px solid var(--edge); border-radius:3px;
           overflow:hidden; background:#060708; cursor:grab; }
  #stage.dragging { cursor:grabbing; }
  #stage canvas { display:block; }
  .hint { position:absolute; left:12px; bottom:10px; color:#45505a; font-size:12px; pointer-events:none; }
  .rail { display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; align-items:center; }
  .rail .lbl { color:var(--dim); font-size:12px; margin-right:4px; }
  button { font:inherit; font-size:13px; color:var(--read); background:var(--steel);
           border:1px solid var(--edge); border-radius:2px; padding:7px 13px; cursor:pointer;
           transition:border-color .12s,color .12s; }
  button:hover { border-color:#3a444d; color:#e6ebef; }
  button:focus-visible { outline:2px solid var(--lens); outline-offset:1px; }
  button[aria-pressed="true"] { border-color:var(--lens); color:var(--lens); }
  .rail.secondary { margin-top:8px; }
  .readout { margin-top:16px; border-top:1px solid var(--edge); padding-top:14px;
             display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:4px 20px; }
  .readout div { display:flex; justify-content:space-between; gap:10px; }
  .readout span:first-child { color:var(--dim); }
  .readout span:last-child { font-variant-numeric:tabular-nums; }
  .note { margin-top:20px; padding-top:14px; border-top:1px solid var(--edge);
          color:var(--dim); font-size:13px; max-width:64ch; }
  .note b { color:var(--read); font-weight:500; }
</style>
</head>
<body>
<div class="wrap">
  <h1>루미 v3 — 코어 부양 · 렌즈 아이</h1>
  <p class="sub">자이로 링 제거. 하부 코어 모듈이 부양을 담당하고, 얼굴은 조리개가 있는 카메라 렌즈 유닛.</p>

  <div id="stage"><p class="hint">드래그 회전 · 휠 확대</p></div>

  <div class="rail" id="states"><span class="lbl">상태</span></div>
  <div class="rail secondary">
    <span class="lbl">디스플레이</span>
    <button id="m-func" aria-pressed="true">기능형</button>
    <button id="m-face" aria-pressed="false">표정형</button>
  </div>
  <div class="rail secondary">
    <button id="silence">0.5초 침묵 (부양 끊김)</button>
    <button id="spin" aria-pressed="true">자동 회전</button>
    <button id="wire" aria-pressed="false">와이어프레임</button>
    <button id="lights" aria-pressed="false">함선 조명 끄기</button>
  </div>

  <div class="readout">
    <div><span>정점</span><span id="r-verts">—</span></div>
    <div><span>삼각형</span><span id="r-tris">—</span></div>
    <div><span>부양 출력</span><span id="r-lift">—</span></div>
    <div><span>조리개</span><span id="r-iris">—</span></div>
    <div><span>롤</span><span id="r-roll">—</span></div>
    <div><span>디스플레이</span><span id="r-disp">—</span></div>
  </div>

  <p class="note">
    <b>노즐</b>은 자세에 맞춰 반대로 짐벌합니다 — 기울면 노즐이 먼저 반응합니다.
    <b>0.5초 침묵</b>은 이제 링이 아니라 부양이 끊기는 것으로 처리했습니다. 살짝 가라앉았다 회복합니다.
    <b>정지</b>를 누르면 코어 창이 꺼지고 루미가 주저앉습니다 — S9에서 코어를 뽑는다는 게 어떤 의미인지 그대로 보입니다.
  </p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
"use strict";
var T = THREE;
function cv(w,h){ var c=document.createElement("canvas"); c.width=w; c.height=h; return c; }

/* ============================================================
   1. 절차적 텍스처
   ============================================================ */
function paintBump(){
  var c=cv(512,512), g=c.getContext("2d");
  var img=g.createImageData(512,512), d=img.data;
  for(var i=0;i<d.length;i+=4){ var n=128+(Math.random()-.5)*16; d[i]=d[i+1]=d[i+2]=n; d[i+3]=255; }
  g.putImageData(img,0,0);
  g.strokeStyle="rgba(155,155,155,.45)"; g.lineWidth=1;
  for(var s=0;s<50;s++){ var y=Math.random()*512, x=Math.random()*512, l=20+Math.random()*90;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+l,y+(Math.random()-.5)*4); g.stroke(); }
  g.strokeStyle="rgba(64,64,64,.9)"; g.lineWidth=3;
  [0.14,0.38,0.63,0.86].forEach(function(u){ g.beginPath(); g.moveTo(u*512,0); g.lineTo(u*512,512); g.stroke(); });
  g.lineWidth=2;
  [0.30,0.70].forEach(function(v){ g.beginPath(); g.moveTo(0,v*512); g.lineTo(512,v*512); g.stroke(); });
  return c;
}
function paintAlbedo(){
  var c=cv(1024,512), g=c.getContext("2d");
  g.fillStyle="#eceee9"; g.fillRect(0,0,1024,512);
  for(var i=0;i<1100;i++){ g.fillStyle="rgba(118,124,120,"+(Math.random()*.055)+")";
    g.beginPath(); g.arc(Math.random()*1024, Math.random()*512, 4+Math.random()*42, 0, 6.283); g.fill(); }
  /* 에지 때 — 아래쪽이 더 더럽다 */
  var grd=g.createLinearGradient(0,300,0,512);
  grd.addColorStop(0,"rgba(90,96,92,0)"); grd.addColorStop(1,"rgba(80,86,82,.22)");
  g.fillStyle=grd; g.fillRect(0,300,1024,212);

  g.fillStyle="#39414a"; g.font="600 32px system-ui,sans-serif"; g.fillText("MU-07", 232, 214);
  g.font="400 16px system-ui,sans-serif"; g.fillStyle="#6d747a";
  g.fillText("MAINTENANCE UNIT", 232, 238);
  g.fillText("HULL SVC / DECK 3", 232, 258);
  g.fillText("PWR: STD CORE  1.6kW", 232, 278);

  g.save(); g.translate(660,196);
  for(var k=0;k<6;k++){ g.fillStyle=k%2?"#2b3136":"#c6a03e";
    g.beginPath(); g.moveTo(k*20,0); g.lineTo(k*20+12,0); g.lineTo(k*20+26,42); g.lineTo(k*20+14,42);
    g.closePath(); g.fill(); }
  g.restore();
  g.strokeStyle="#868d93"; g.lineWidth=2; g.strokeRect(660,268,126,40);
  g.fillStyle="#868d93"; g.font="400 13px system-ui,sans-serif"; g.fillText("SVC 2291.114",670,293);
  return c;
}

/* ============================================================
   2. 지오메트리 헬퍼
   ============================================================ */
function lathe(profile, seg){
  var rings=[], i, j;
  for(i=0;i<profile.length;i++){ rings.push(profile[i]);
    if(profile[i][2] && i>0 && i<profile.length-1) rings.push(profile[i]); }
  var pos=[], uv=[], idx=[], lens=[0], total=0;
  for(i=1;i<rings.length;i++){ total+=Math.hypot(rings[i][0]-rings[i-1][0], rings[i][1]-rings[i-1][1]); lens.push(total); }
  for(i=0;i<rings.length;i++){ var r=rings[i][0], y=rings[i][1];
    for(j=0;j<=seg;j++){ var t=2*Math.PI*j/seg;
      pos.push(r*Math.sin(t), y, r*Math.cos(t)); uv.push(j/seg, total>0?lens[i]/total:0); } }
  var row=seg+1;
  for(i=0;i<rings.length-1;i++){
    if(rings[i][0]===rings[i+1][0] && rings[i][1]===rings[i+1][1]) continue;
    for(j=0;j<seg;j++){ var v0=i*row+j; idx.push(v0,v0+row,v0+row+1, v0,v0+row+1,v0+1); } }
  var g=new T.BufferGeometry();
  g.setAttribute("position", new T.Float32BufferAttribute(pos,3));
  g.setAttribute("uv", new T.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}

/* [r, y, hard] */
var UPPER = [
  [0.000,0.268,0],[0.050,0.263,0],[0.098,0.246,0],[0.144,0.216,0],[0.176,0.176,0],
  [0.192,0.142,1],[0.200,0.122,1],[0.202,0.110,1],[0.190,0.102,1]
];
var FRAME = [ [0.190,0.102,1],[0.194,0.094,1],[0.194,0.058,1],[0.190,0.050,1] ];
var LOWER = [
  [0.190,0.050,1],[0.204,0.042,1],[0.208,0.010,0],[0.204,-0.046,0],[0.191,-0.102,0],
  [0.169,-0.146,0],[0.148,-0.172,1],[0.132,-0.182,1]
];
var CORE = [
  [0.132,-0.182,1],[0.128,-0.192,1],[0.126,-0.240,1],[0.112,-0.254,1],
  [0.080,-0.264,1],[0.072,-0.274,1],[0.000,-0.278,0]
];

/* ============================================================
   3. 씬 · 재질
   ============================================================ */
var stage=document.getElementById("stage");
var W=stage.clientWidth, H=stage.clientHeight;
var renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(W,H);
renderer.outputEncoding=T.sRGBEncoding;
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

var scene=new T.Scene();
scene.background=new T.Color(0x060708);
scene.fog=new T.Fog(0x060708, 2.4, 8.0);
var camera=new T.PerspectiveCamera(36, W/H, 0.05, 60);

(function(){
  var c=cv(256,128), g=c.getContext("2d");
  var gr=g.createLinearGradient(0,0,0,128);
  gr.addColorStop(0,"#4e6070"); gr.addColorStop(.45,"#1b2228");
  gr.addColorStop(.55,"#0d1115"); gr.addColorStop(1,"#05070a");
  g.fillStyle=gr; g.fillRect(0,0,256,128);
  g.fillStyle="#a3bacd"; g.fillRect(18,32,96,5);
  g.fillStyle="#6f8ea6"; g.fillRect(158,44,64,3);
  var tex=new T.CanvasTexture(c);
  tex.mapping=T.EquirectangularReflectionMapping; tex.encoding=T.sRGBEncoding;
  var p=new T.PMREMGenerator(renderer);
  scene.environment=p.fromEquirectangular(tex).texture; p.dispose();
})();

var albedo=new T.CanvasTexture(paintAlbedo());
albedo.encoding=T.sRGBEncoding; albedo.wrapS=albedo.wrapT=T.RepeatWrapping;
var bump=new T.CanvasTexture(paintBump());
bump.wrapS=bump.wrapT=T.RepeatWrapping;

var matPaint=new T.MeshPhysicalMaterial({ map:albedo, bumpMap:bump, bumpScale:0.0018,
  roughness:0.36, metalness:0.0, clearcoat:0.65, clearcoatRoughness:0.24, envMapIntensity:1.0 });
var matGraphite=new T.MeshStandardMaterial({ color:0x1a1f24, roughness:0.46, metalness:0.66, envMapIntensity:1.0 });
var matDark=new T.MeshStandardMaterial({ color:0x0d1114, roughness:0.72, metalness:0.35 });
var matRubber=new T.MeshStandardMaterial({ color:0x13171a, roughness:0.96, metalness:0.0 });
var matSteel=new T.MeshStandardMaterial({ color:0x9ba2a8, roughness:0.24, metalness:0.96, envMapIntensity:1.25 });
var matBrass=new T.MeshStandardMaterial({ color:0xb08a44, roughness:0.32, metalness:0.9, envMapIntensity:1.2 });
var matGlass=new T.MeshPhysicalMaterial({ color:0x05080c, roughness:0.05, metalness:0.2,
  clearcoat:1.0, clearcoatRoughness:0.03, transparent:true, opacity:0.6, envMapIntensity:1.5 });
var matCoreGlow=new T.MeshBasicMaterial({ color:0x4fd2ff });
var matNozzleGlow=new T.MeshBasicMaterial({ color:0x2f88b8 });
var matLedRing=new T.MeshBasicMaterial({ color:0xffe6bd });

var rig=new T.Group(), body=new T.Group();
rig.add(body); scene.add(rig);

var vcount=0, tcount=0;
function add(parent, geo, mat, shadow){
  var m=new T.Mesh(geo, mat); m.castShadow = shadow!==false; parent.add(m);
  vcount+=geo.attributes.position.count;
  tcount+=(geo.index?geo.index.count:geo.attributes.position.count)/3;
  return m;
}

/* ---- 셸 ---- */
add(body, lathe(UPPER,40), matPaint);
add(body, lathe(FRAME,40), matGraphite);
add(body, lathe(LOWER,40), matPaint);

/* ---- 하부 코어 모듈 (부양 담당) ---- */
var coreMod=new T.Group(); body.add(coreMod);
add(coreMod, lathe(CORE,32), matGraphite);

/* 코어 관찰창 4개 — 여기 들어있는 게 S9에서 슬롯에 꽂히는 그 코어다 */
var coreWindows=[];
(function(){
  var w=new T.BoxGeometry(0.030,0.046,0.012);
  for(var k=0;k<4;k++){
    var a=k/4*Math.PI*2+0.78;
    var frame=add(coreMod, new T.BoxGeometry(0.040,0.056,0.010), matDark, false);
    frame.position.set(0.124*Math.sin(a), -0.216, 0.124*Math.cos(a)); frame.rotation.y=a;
    var gl=add(coreMod, w, matCoreGlow, false);
    gl.position.set(0.128*Math.sin(a), -0.216, 0.128*Math.cos(a)); gl.rotation.y=a;
    coreWindows.push(gl);
  }
})();

/* 짐벌 노즐 3개 — 자세에 맞춰 반대로 기운다 */
var nozzles=[], nozzleGlows=[];
(function(){
  var bell=new T.CylinderGeometry(0.020,0.034,0.052,14,1,true);
  var lip =new T.TorusGeometry(0.034,0.005,6,18);
  var inner=new T.CircleGeometry(0.028,14);
  for(var k=0;k<3;k++){
    var a=k/3*Math.PI*2 + Math.PI;      /* 하나는 뒤, 둘은 앞 */
    var g=new T.Group();
    g.position.set(0.082*Math.sin(a), -0.268, 0.082*Math.cos(a));
    coreMod.add(g);
    add(g, bell, matGraphite);
    var l=add(g, lip, matSteel, false); l.position.y=-0.026; l.rotation.x=Math.PI/2;
    var gl=add(g, inner, matNozzleGlow, false); gl.position.y=-0.020; gl.rotation.x=Math.PI/2;
    nozzles.push(g); nozzleGlows.push(gl);
  }
})();

/* ---- 후면 방열핀 ---- */
(function(){
  var fin=new T.BoxGeometry(0.088,0.006,0.034);
  for(var k=0;k<7;k++){
    var m=add(body, fin, matSteel, false);
    m.position.set(0, 0.128-k*0.026, -0.172+k*0.004);
    m.rotation.x=-0.22;
  }
  var housing=add(body, new T.BoxGeometry(0.104,0.208,0.030), matGraphite, false);
  housing.position.set(0, 0.036, -0.180); housing.rotation.x=-0.10;
})();

/* ---- 비대칭 파츠: 좌측 센서 포드 / 우측 툴 커넥터 ---- */
(function(){
  var pod=add(body, new T.BoxGeometry(0.052,0.040,0.072), matGraphite);
  pod.position.set(-0.186,0.026,0.046); pod.rotation.y=-0.5;
  var podLens=add(body, new T.CylinderGeometry(0.014,0.016,0.012,14), matGlass, false);
  podLens.position.set(-0.200,0.026,0.076); podLens.rotation.set(Math.PI/2,0,0); podLens.rotation.z=-0.5;

  var conn=add(body, new T.CylinderGeometry(0.026,0.030,0.040,12), matGraphite);
  conn.position.set(0.190,0.010,0.040); conn.rotation.set(0,0,Math.PI/2); conn.rotation.y=0.4;
  var pin=add(body, new T.CylinderGeometry(0.006,0.006,0.052,8), matBrass, false);
  pin.position.set(0.206,0.010,0.044); pin.rotation.set(0,0,Math.PI/2); pin.rotation.y=0.4;
})();

/* ---- 케이블 하니스 (프레임 → 코어 모듈) ---- */
(function(){
  [-1,1].forEach(function(s){
    var curve=new T.CatmullRomCurve3([
      new T.Vector3(s*0.145, 0.062, -0.120),
      new T.Vector3(s*0.178, -0.010, -0.128),
      new T.Vector3(s*0.160, -0.110, -0.106),
      new T.Vector3(s*0.100, -0.190, -0.060)
    ]);
    add(body, new T.TubeGeometry(curve, 20, 0.0075, 7, false), matRubber, false);
  });
})();

/* ---- 리벳 / 볼트 ---- */
(function(){
  var rv=new T.CylinderGeometry(0.005,0.005,0.004,6);
  for(var k=0;k<10;k++){
    var a=k/10*Math.PI*2+0.31;
    var m=add(body, rv, matSteel, false);
    m.position.set(0.203*Math.sin(a), 0.026, 0.203*Math.cos(a));
    m.rotation.set(Math.PI/2,0,-a);
  }
})();

/* ---- 상단 안테나 ---- */
(function(){
  var m=add(body, new T.CylinderGeometry(0.005,0.008,0.048,10), matGraphite);
  m.position.set(0,0.288,-0.026); m.rotation.x=0.30;
  var t=add(body, new T.SphereGeometry(0.008,10,8), matBrass, false);
  t.position.set(0,0.311,-0.033);
})();

/* ============================================================
   4. 렌즈 아이 — 배럴 + 조리개 + 디스플레이
   ============================================================ */
var eye=new T.Group();               /* 본체보다 빠르게 목표를 추적한다 */
eye.position.set(0, 0.046, 0.128);
body.add(eye);

/* 배럴 후드 */
var HOOD=[ [0.086,0.000,1],[0.092,0.014,1],[0.092,0.030,1],[0.078,0.036,1],
           [0.074,0.026,1],[0.074,0.004,1] ];
(function(){
  var g=lathe(HOOD,36); g.rotateX(Math.PI/2);   /* Y축 회전체를 Z축 전방으로 */
  add(eye, g, matGraphite);
})();
/* 포커스 링 (홈이 파인 느낌) */
(function(){
  var ring=add(eye, new T.TorusGeometry(0.079,0.008,8,40), matGraphite, false);
  ring.position.z=0.012;
  var knurl=new T.BoxGeometry(0.006,0.014,0.010);
  for(var k=0;k<28;k++){
    var a=k/28*Math.PI*2;
    var m=add(eye, knurl, matSteel, false);
    m.position.set(0.083*Math.cos(a), 0.083*Math.sin(a), 0.012);
    m.rotation.z=a;
  }
})();
/* LED 링 — 루미의 광원 */
var ledRing=[];
(function(){
  var led=new T.BoxGeometry(0.010,0.007,0.004);
  for(var k=0;k<12;k++){
    var a=k/12*Math.PI*2;
    var m=add(eye, led, matLedRing, false);
    m.position.set(0.068*Math.cos(a), 0.068*Math.sin(a), 0.030);
    m.rotation.z=a; ledRing.push(m);
  }
})();

/* 조리개 블레이드 8장 */
var blades=[], BLADE_N=8, PIVOT_R=0.060;
(function(){
  var s=new T.Shape();
  s.moveTo(0,0);
  s.lineTo(0.020,0.016);
  s.quadraticCurveTo(0.072,0.030, 0.096,-0.004);
  s.lineTo(0.070,-0.022);
  s.quadraticCurveTo(0.030,-0.020, 0,-0.010);
  s.closePath();
  var geo=new T.ExtrudeGeometry(s,{depth:0.0016, bevelEnabled:false, curveSegments:8});
  for(var k=0;k<BLADE_N;k++){
    var pivot=new T.Group();
    var a=k/BLADE_N*Math.PI*2;
    pivot.position.set(PIVOT_R*Math.cos(a), PIVOT_R*Math.sin(a), 0.006);
    pivot.rotation.z=a+Math.PI;
    eye.add(pivot);
    var m=new T.Mesh(geo, matDark); m.castShadow=false; pivot.add(m);
    vcount+=geo.attributes.position.count; tcount+=geo.attributes.position.count/3;
    blades.push(pivot);
  }
})();

/* 디스플레이 (조리개 뒤) */
var FD=256;
var faceCv=cv(FD,FD), fx=faceCv.getContext("2d");
var faceTex=new T.CanvasTexture(faceCv); faceTex.encoding=T.sRGBEncoding;
var matFace=new T.MeshBasicMaterial({ map:faceTex, transparent:true });
var display=add(eye, new T.CircleGeometry(0.062,40), matFace, false);
display.position.z=-0.004;

/* 글라스 */
var glass=add(eye, new T.CircleGeometry(0.074,40), matGlass, false);
glass.position.z=0.026;

/* ============================================================
   5. 무대
   ============================================================ */
var floor=new T.Mesh(new T.PlaneGeometry(30,30),
  new T.MeshStandardMaterial({color:0x14171a, roughness:0.9, metalness:0.1}));
floor.rotation.x=-Math.PI/2; floor.position.y=-1.05; floor.receiveShadow=true; scene.add(floor);

var amb=new T.AmbientLight(0x1c242b,0.7); scene.add(amb);
var key=new T.DirectionalLight(0xdce8f2,1.15); key.position.set(2.2,3.0,2.6);
key.castShadow=true; key.shadow.mapSize.set(1024,1024);
key.shadow.camera.near=0.5; key.shadow.camera.far=12; scene.add(key);
var rimA=new T.DirectionalLight(0x5aa4ff,1.55); rimA.position.set(-3,1.2,-2.4); scene.add(rimA);
var rimB=new T.DirectionalLight(0xff9a5c,0.8); rimB.position.set(2.6,0.4,-2.8); scene.add(rimB);
var bounce=new T.DirectionalLight(0x2c3b47,0.5); bounce.position.set(0,-3,1); scene.add(bounce);
var shipLights=[key,rimA,rimB,bounce];

var spot=new T.SpotLight(0xffe8c4,3.0,14,0.73,0.45,1.5);
spot.castShadow=true; spot.shadow.mapSize.set(1024,1024);
var spotTarget=new T.Object3D(); scene.add(spot); scene.add(spotTarget); spot.target=spotTarget;
var beam=new T.Mesh(new T.ConeGeometry(1,1,28,1,true),
  new T.MeshBasicMaterial({color:0xffdcaa, transparent:true, opacity:0.04, side:T.DoubleSide, depthWrite:false}));
scene.add(beam);

/* ============================================================
   6. 디스플레이 그리기
   ============================================================ */
var C=FD/2, GLOW="#7de0ff";
function clearFace(){ fx.clearRect(0,0,FD,FD);
  fx.save(); fx.beginPath(); fx.arc(C,C,C-2,0,6.283); fx.clip();
  fx.fillStyle="#03070b"; fx.fillRect(0,0,FD,FD); }
function endFace(){
  fx.fillStyle="rgba(0,0,0,.28)";
  for(var y=0;y<FD;y+=3) fx.fillRect(0,y,FD,1);
  fx.restore(); faceTex.needsUpdate=true;
}
function rr(g,x,y,w,h,r){ g.beginPath();
  g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.closePath(); }

function drawFunctional(st,t){
  clearFace(); var g=fx;
  g.shadowColor=GLOW; g.shadowBlur=14; g.fillStyle=GLOW; g.strokeStyle=GLOW;
  if(st==="DEAD"){
    g.shadowBlur=10; var n=Math.max(0,90-Math.floor(t))%100;
    g.globalAlpha=(t%1)<0.14?1:0.10;
    g.font="500 84px ui-monospace,monospace"; g.textAlign="center";
    g.fillText(("0"+n).slice(-2), C, C+30); g.globalAlpha=1;
  } else if(st==="SCAN"){
    g.lineWidth=3;
    g.beginPath(); g.arc(C,C,74,0,6.283); g.stroke();
    g.beginPath(); g.arc(C,C,26,0,6.283); g.stroke();
    for(var q=0;q<4;q++){ g.save(); g.translate(C,C); g.rotate(q*Math.PI/2);
      g.fillRect(-2,-104,4,22); g.restore(); }
    var sy=C+Math.sin(t*3.4)*72;
    g.globalAlpha=.5; g.fillRect(20,sy-1,FD-40,3); g.globalAlpha=1;
    g.font="400 15px ui-monospace,monospace"; g.textAlign="left";
    g.fillText("SCAN", 36, 42);
  } else if(st==="TALK"){
    for(var i=0;i<20;i++){
      var x=28+i*10, hh=6+Math.abs(Math.sin(t*13+i*0.9))*70*Math.sin((i+0.5)/20*Math.PI);
      g.fillRect(x, C-hh/2, 6, hh);
    }
  } else {
    rr(g, C-84, C-6, 62, 11, 5); g.fill();
    rr(g, C+22, C-6, 62, 11, 5); g.fill();
    for(var k=0;k<5;k++){
      g.globalAlpha = (k/4 < (0.5+0.5*Math.sin(t*1.6))) ? 0.85 : 0.14;
      g.fillRect(C-44+k*22, C+42, 13, 5);
    }
    g.globalAlpha=1;
  }
  g.shadowBlur=0; endFace();
}

var blinkT=0, nextBlink=2.6;
function drawExpressive(st,t,dt){
  clearFace(); var g=fx;
  blinkT+=dt; var blink=1;
  if(blinkT>nextBlink){ var p=(blinkT-nextBlink)/0.13;
    if(p>=1){ blinkT=0; nextBlink=1.8+Math.random()*3.4; } else blink=Math.abs(p-0.5)*2; }
  g.shadowColor=GLOW; g.shadowBlur=18; g.fillStyle=GLOW;
  var eh=62, ew=48, tilt=0;
  if(st==="SCAN"){ eh=22; ew=64; }
  else if(st==="TALK"){ eh=70; ew=44; }
  else if(st==="MOVE"||st==="DOCK"){ eh=42; ew=52; tilt=0.14; }
  else if(st==="DEAD"){ eh=4; ew=26; }
  eh*=blink;
  [-1,1].forEach(function(s){
    g.save(); g.translate(C+s*42, C); g.rotate(s*tilt);
    rr(g,-ew/2,-eh/2,ew,Math.max(eh,3),Math.min(ew,eh)/2.6); g.fill(); g.restore();
  });
  if(st==="DEAD"){ g.globalAlpha=(t%1)<0.12?0.9:0.05; g.fillRect(C-3,C+44,6,6); g.globalAlpha=1; }
  g.shadowBlur=0; endFace();
}

/* ============================================================
   7. 상태기
   ============================================================ */
var STATES=[
  { key:"IDLE", label:"대기", iris:0.62, cone:42, light:1, move:0 },
  { key:"SCAN", label:"스캔", iris:0.24, cone:14, light:1, move:0 },
  { key:"MOVE", label:"이동", iris:0.72, cone:38, light:1, move:1.35 },
  { key:"TALK", label:"대사", iris:0.62, cone:42, light:1, move:0 },
  { key:"DOCK", label:"도킹", iris:0.72, cone:38, light:1, move:1.35 },
  { key:"DEAD", label:"정지", iris:0.00, cone:0,  light:0, move:0 }
];
var L={ pos:new T.Vector3(), vel:new T.Vector3(), target:new T.Vector3(),
        yaw:0,pitch:0,roll:0,yawV:0,pitchV:0, eyeYaw:0,eyePitch:0,eyeYawV:0,eyePitchV:0,
        bobT:0, iris:0.62, cone:42, light:1, lift:1, hold:0, sag:0, state:0, deadT:0 };
var faceMode="func";

function wrapPi(a){ while(a>Math.PI)a-=6.283185; while(a<-Math.PI)a+=6.283185; return a; }
function lerp(a,b,t){ return a+(b-a)*t; }
function clamp(x,a,b){ return x<a?a:(x>b?b:x); }
function sdamp(cur,goal,o,k,sm,dt){
  var w=2/Math.max(sm,1e-4), x=w*dt, ex=1/(1+x+0.48*x*x+0.235*x*x*x);
  var ch=wrapPi(cur-goal), tmp=(o[k]+w*ch)*dt;
  o[k]=(o[k]-w*tmp)*ex; return goal+(ch+tmp)*ex;
}

var wander=0, ORIGIN=new T.Vector3(), tmpV=new T.Vector3(), fwd=new T.Vector3(), lensPos=new T.Vector3();

function update(dt){
  var p=STATES[L.state];

  if(p.move>0){
    wander+=dt;
    L.target.set(Math.sin(wander*0.55)*0.85, Math.sin(wander*0.31)*0.16, Math.cos(wander*0.42)*0.5);
    ["x","y","z"].forEach(function(ax){
      L.vel[ax]+=(L.target[ax]-L.pos[ax])*6*dt;
      L.vel[ax]*=Math.pow(0.06,dt);
      L.vel[ax]=clamp(L.vel[ax],-p.move,p.move);
      L.pos[ax]+=L.vel[ax]*dt; });
  } else {
    ["x","y","z"].forEach(function(ax){ L.vel[ax]*=Math.pow(0.02,dt); });
    L.pos.lerp(ORIGIN, 1-Math.pow(0.15,dt));
  }

  /* 부양 출력 — 0.5초 침묵은 여기가 끊긴다 */
  var liftGoal = (p.key==="DEAD") ? 0 : (L.hold>0 ? 0 : 1);
  if(L.hold>0) L.hold-=dt;
  L.lift = lerp(L.lift, liftGoal, 1-Math.pow(0.004,dt));
  L.sag  = lerp(L.sag, (1-L.lift)*0.075, 1-Math.pow(0.02,dt));

  L.bobT+=dt;
  var bob=(0.030*Math.sin(L.bobT*2.62)+0.008*Math.sin(L.bobT*3.70))*L.lift - L.sag;

  var dx=camera.position.x-L.pos.x, dy=camera.position.y-(L.pos.y+bob), dz=camera.position.z-L.pos.z;
  var gy=Math.atan2(dx,dz), gp=-Math.atan2(dy,Math.hypot(dx,dz));
  /* 본체는 굼뜨고, 렌즈는 빠르다 — 이 시차가 '눈이 있다'는 인상을 만든다 */
  L.yaw   = sdamp(L.yaw,   gy, L,"yawV",   0.26, dt);
  L.pitch = sdamp(L.pitch, gp, L,"pitchV", 0.30, dt);
  L.eyeYaw   = sdamp(L.eyeYaw,   gy, L,"eyeYawV",   0.09, dt);
  L.eyePitch = sdamp(L.eyePitch, gp, L,"eyePitchV", 0.10, dt);

  var rv=L.vel.x*Math.cos(L.yaw)-L.vel.z*Math.sin(L.yaw);
  L.roll=lerp(L.roll, clamp(-rv*0.28,-0.30,0.30), 1-Math.pow(0.001,dt));

  if(p.key==="DEAD"){ L.light=0; L.cone=0; L.deadT+=dt; }
  else { L.deadT=0;
    L.cone=lerp(L.cone,p.cone,1-Math.pow(0.002,dt));
    L.light=lerp(L.light,p.light,1-Math.pow(0.002,dt)); }
  L.iris=lerp(L.iris,p.iris,1-Math.pow(0.004,dt));

  /* --- 적용 --- */
  rig.position.set(L.pos.x, L.pos.y+bob, L.pos.z);
  body.rotation.set(L.pitch, L.yaw, L.roll, "YXZ");
  eye.rotation.set(L.eyePitch-L.pitch, L.eyeYaw-L.yaw, 0, "YXZ");

  /* 조리개: iris 0=닫힘 1=열림 */
  var open=-1.05*L.iris;
  for(var b=0;b<blades.length;b++){
    var a=b/BLADE_N*Math.PI*2;
    blades[b].rotation.z=a+Math.PI+open;
  }

  /* 노즐 짐벌 — 자세를 상쇄하는 방향으로 */
  for(var n=0;n<nozzles.length;n++){
    nozzles[n].rotation.x = clamp(-L.pitch*0.6 - L.vel.z*0.25, -0.45, 0.45);
    nozzles[n].rotation.z = clamp(-L.roll*0.9  + L.vel.x*0.25, -0.45, 0.45);
    nozzleGlows[n].material = matNozzleGlow;
  }
  matNozzleGlow.color.setRGB(0.18*L.lift, 0.53*L.lift, 0.72*L.lift);
  matCoreGlow.color.setRGB(0.31*L.lift, 0.82*L.lift, 1.0*L.lift);
  matLedRing.color.setRGB(1.0*L.light, 0.90*L.light, 0.74*L.light);

  var ft = p.key==="DEAD" ? L.deadT : L.bobT;
  if(faceMode==="func") drawFunctional(p.key, ft);
  else drawExpressive(p.key, ft, dt);

  eye.getWorldDirection(fwd);
  eye.getWorldPosition(lensPos);
  spot.position.copy(lensPos);
  spotTarget.position.copy(lensPos).addScaledVector(fwd,6);
  spot.angle=Math.max(T.MathUtils.degToRad(L.cone),0.001);
  spot.intensity=3.0*L.light;

  beam.visible=L.light>0.02;
  if(beam.visible){
    var reach=5, r=Math.tan(spot.angle)*reach;
    beam.scale.set(r,reach,r);
    beam.position.copy(lensPos).addScaledVector(fwd,reach/2);
    beam.quaternion.setFromUnitVectors(tmpV.set(0,-1,0), fwd);
    beam.material.opacity=0.045*L.light;
  }
}

/* ============================================================
   8. 카메라 · UI
   ============================================================ */
var orbit={theta:0.6, phi:1.44, dist:1.25, auto:true};
function placeCamera(){
  camera.position.set(
    orbit.dist*Math.sin(orbit.phi)*Math.sin(orbit.theta),
    orbit.dist*Math.cos(orbit.phi),
    orbit.dist*Math.sin(orbit.phi)*Math.cos(orbit.theta));
  camera.lookAt(0,0.02,0);
}
var dragging=false,lx=0,ly=0;
stage.addEventListener("pointerdown",function(e){ dragging=true; lx=e.clientX; ly=e.clientY;
  stage.classList.add("dragging"); stage.setPointerCapture(e.pointerId); });
stage.addEventListener("pointermove",function(e){ if(!dragging)return;
  orbit.theta-=(e.clientX-lx)*0.008;
  orbit.phi=clamp(orbit.phi-(e.clientY-ly)*0.008,0.35,2.6);
  lx=e.clientX; ly=e.clientY; });
stage.addEventListener("pointerup",function(e){ dragging=false;
  stage.classList.remove("dragging"); stage.releasePointerCapture(e.pointerId); });
stage.addEventListener("wheel",function(e){ e.preventDefault();
  orbit.dist=clamp(orbit.dist+e.deltaY*0.0014,0.55,4.5); },{passive:false});

var railEl=document.getElementById("states");
var btns=STATES.map(function(s,i){
  var b=document.createElement("button"); b.textContent=s.label;
  b.setAttribute("aria-pressed", i===0?"true":"false");
  b.addEventListener("click",function(){ L.state=i; L.deadT=0;
    btns.forEach(function(o,k){ o.setAttribute("aria-pressed", k===i?"true":"false"); }); });
  railEl.appendChild(b); return b;
});
var bF=document.getElementById("m-func"), bE=document.getElementById("m-face");
function setMode(m){ faceMode=m;
  bF.setAttribute("aria-pressed", m==="func"?"true":"false");
  bE.setAttribute("aria-pressed", m==="face"?"true":"false");
  document.getElementById("r-disp").textContent = m==="func"?"기능형":"표정형"; }
bF.addEventListener("click",function(){ setMode("func"); });
bE.addEventListener("click",function(){ setMode("face"); });

document.getElementById("silence").addEventListener("click",function(){ L.hold=0.5; });
var spinBtn=document.getElementById("spin");
spinBtn.addEventListener("click",function(){ orbit.auto=!orbit.auto;
  spinBtn.setAttribute("aria-pressed", orbit.auto?"true":"false"); });
var wireBtn=document.getElementById("wire");
wireBtn.addEventListener("click",function(){
  var on=wireBtn.getAttribute("aria-pressed")!=="true";
  wireBtn.setAttribute("aria-pressed", on?"true":"false");
  [matPaint,matGraphite,matDark,matSteel,matRubber,matBrass].forEach(function(m){ m.wireframe=on; }); });
var lightBtn=document.getElementById("lights");
lightBtn.addEventListener("click",function(){
  var off=lightBtn.getAttribute("aria-pressed")!=="true";
  lightBtn.setAttribute("aria-pressed", off?"true":"false");
  shipLights.forEach(function(l){ l.visible=!off; });
  amb.intensity= off?0.10:0.7; });

document.getElementById("r-verts").textContent=vcount.toLocaleString();
document.getElementById("r-tris").textContent=Math.round(tcount).toLocaleString();
setMode("func");

window.addEventListener("resize",function(){
  W=stage.clientWidth; H=stage.clientHeight;
  camera.aspect=W/H; camera.updateProjectionMatrix(); renderer.setSize(W,H); });

var prev=performance.now(), acc=0;
var rLift=document.getElementById("r-lift"), rIris=document.getElementById("r-iris"), rRoll=document.getElementById("r-roll");
function frame(now){
  var dt=Math.min((now-prev)/1000,0.05); prev=now;
  if(orbit.auto && !dragging) orbit.theta+=dt*0.16;
  placeCamera(); update(dt);
  acc+=dt;
  if(acc>0.12){ acc=0;
    rLift.textContent=Math.round(L.lift*100)+"%";
    rIris.textContent="f/"+(1.4+ (1-L.iris)*14).toFixed(1);
    rRoll.textContent=(L.roll*57.2958).toFixed(1)+"°"; }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
placeCamera(); requestAnimationFrame(frame);
})();
</script>
