<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>루미 v5</title>
<style>
  :root { --void:#0a0c0e; --steel:#14181c; --edge:#232a30; --dim:#6d7780; --read:#b9c2c9; --cy:#5fd0f5; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--void); color:var(--read);
         font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;
         font-size:14px; line-height:1.6; }
  .wrap { max-width:940px; margin:0 auto; padding:24px 20px 40px; }
  h1 { font-size:17px; font-weight:500; margin:0 0 2px; color:#e6ebef; letter-spacing:-.01em; }
  .sub { color:var(--dim); font-size:13px; margin:0 0 18px; }
  #stage { position:relative; height:520px; border:1px solid var(--edge); border-radius:3px;
           overflow:hidden; background:#070809; cursor:grab; }
  #stage.dragging { cursor:grabbing; }
  #stage canvas { display:block; }
  .hint { position:absolute; left:12px; bottom:10px; color:#45505a; font-size:12px; pointer-events:none; }
  .rail { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; align-items:center; }
  .rail .lbl { color:var(--dim); font-size:12px; margin-right:4px; min-width:64px; }
  button { font:inherit; font-size:13px; color:var(--read); background:var(--steel);
           border:1px solid var(--edge); border-radius:2px; padding:6px 11px; cursor:pointer;
           transition:border-color .12s,color .12s; }
  button:hover { border-color:#3a444d; color:#e6ebef; }
  button:focus-visible { outline:2px solid var(--cy); outline-offset:1px; }
  button[aria-pressed="true"] { border-color:var(--cy); color:var(--cy); }
  .readout { margin-top:16px; border-top:1px solid var(--edge); padding-top:14px;
             display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:4px 20px; }
  .readout div { display:flex; justify-content:space-between; gap:10px; }
  .readout span:first-child { color:var(--dim); }
  .readout span:last-child { font-variant-numeric:tabular-nums; }
  .note { margin-top:20px; padding-top:14px; border-top:1px solid var(--edge);
          color:var(--dim); font-size:13px; max-width:64ch; }
  .note b { color:var(--read); font-weight:500; }
</style>
</head>
<body>
<div class="wrap">
  <h1>루미 v5</h1>
  <p class="sub">구면 투영 바이저, 불투명 디스플레이, 재질 분할. 전부 코드 생성.</p>

  <div id="stage"><p class="hint">드래그 회전 · 휠 확대</p></div>

  <div class="rail" id="row1"><span class="lbl">디스플레이</span></div>
  <div class="rail" id="row2"><span class="lbl"></span></div>
  <div class="rail">
    <span class="lbl">연출</span>
    <button id="ending">엔딩 도킹 시퀀스</button>
    <button id="silence">0.5초 침묵</button>
    <button id="moving" aria-pressed="false">이동 중</button>
  </div>
  <div class="rail">
    <span class="lbl">뷰</span>
    <button id="spin" aria-pressed="true">자동 회전</button>
    <button id="wire" aria-pressed="false">와이어프레임</button>
    <button id="lights" aria-pressed="false">함선 조명 끄기</button>
  </div>

  <div class="readout">
    <div><span>정점</span><span id="r-verts">—</span></div>
    <div><span>삼각형</span><span id="r-tris">—</span></div>
    <div><span>부양 출력</span><span id="r-lift">—</span></div>
    <div><span>상태</span><span id="r-state">—</span></div>
  </div>

  <p class="note">
    바이저·데칼은 구면에 투영한 패치라 곡률을 따라갑니다. 디스플레이는 불투명 검정 바탕이고
    글라스 레이어는 제거했습니다. 몸통은 도장 / 다크밴드 / 스틸 플랜지 / 이미터 하우징으로 나뉩니다.
  </p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
var T=THREE;
function cv(w,h){ var c=document.createElement("canvas"); c.width=w; c.height=h; return c; }
function clamp(x,a,b){ return x<a?a:(x>b?b:x); }
function lerp(a,b,t){ return a+(b-a)*t; }
function sgn(x){ return x<0?-1:1; }

var R=0.222, YS=0.97;
function pt(a,dr){ return [R*Math.sin(a)-(dr||0), R*YS*Math.cos(a)]; }

/* ============================================================
   1. 회전체 — 존별로 나눠 다른 재질을 준다
   ============================================================ */
function lathe(profile, seg, v0, v1){
  var rings=[], i, j;
  for(i=0;i<profile.length;i++){ rings.push(profile[i]);
    if(profile[i][2] && i>0 && i<profile.length-1) rings.push(profile[i]); }
  var pos=[], uv=[], idx=[], acc=[0], tot=0;
  for(i=1;i<rings.length;i++){ tot+=Math.hypot(rings[i][0]-rings[i-1][0], rings[i][1]-rings[i-1][1]); acc.push(tot); }
  for(i=0;i<rings.length;i++){
    var r=rings[i][0], y=rings[i][1];
    for(j=0;j<=seg;j++){
      var u=j/seg, t=2*Math.PI*(u-0.5);
      pos.push(r*Math.sin(t), y, r*Math.cos(t));
      uv.push(u, lerp(v0===undefined?0:v0, v1===undefined?1:v1, tot>0?acc[i]/tot:0));
    }
  }
  var row=seg+1;
  for(i=0;i<rings.length-1;i++){
    if(rings[i][0]===rings[i+1][0] && rings[i][1]===rings[i+1][1]) continue;
    for(j=0;j<seg;j++){ var a=i*row+j; idx.push(a,a+row,a+row+1, a,a+row+1,a+1); }
  }
  var g=new T.BufferGeometry();
  g.setAttribute("position", new T.Float32BufferAttribute(pos,3));
  g.setAttribute("uv", new T.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}

function zone(a0,a1,n,dr){
  var p=[];
  for(var i=0;i<=n;i++){ var a=a0+(a1-a0)*i/n, q=pt(a,dr); p.push([q[0],q[1],0]); }
  return p;
}
var DR=0.0085;                     /* 밴드가 안으로 들어간 깊이 */
var A1=0.44, A2=0.55, A3=1.94, A4=2.05, A5=2.34;

var ZONES=[];
(function(){
  /* 상단 캡 (도장) */
  var cap=zone(0.0, A1, 12, 0);
  cap.push([pt(A1)[0], pt(A1)[1], 1], [pt(A1,DR)[0], pt(A1)[1], 1]);
  ZONES.push({ p:cap, m:"paint" });

  /* 상단 밴드 (다크) */
  var b1=zone(A1, A2, 4, DR);
  b1[0][2]=1; b1[b1.length-1][2]=1;
  b1.push([pt(A2)[0], pt(A2)[1], 1]);
  ZONES.push({ p:b1, m:"band" });

  /* 메인 셸 (도장) */
  var sh=zone(A2, A3, 26, 0);
  sh[0][2]=1;
  sh.push([pt(A3)[0], pt(A3)[1], 1], [pt(A3,DR)[0], pt(A3)[1], 1]);
  ZONES.push({ p:sh, m:"paint" });

  /* 하단 밴드 (다크) */
  var b2=zone(A3, A4, 4, DR);
  b2[0][2]=1; b2[b2.length-1][2]=1;
  b2.push([pt(A4)[0], pt(A4)[1], 1]);
  ZONES.push({ p:b2, m:"band" });

  /* 하단 셸 (도장) */
  var lo=zone(A4, A5, 8, 0);
  lo[0][2]=1;
  ZONES.push({ p:lo, m:"paint" });

  /* 플랜지 (스틸) */
  var e=pt(A5);
  ZONES.push({ p:[[e[0],e[1],1],[e[0]+0.007,e[1]-0.008,1],
                  [e[0]+0.003,e[1]-0.020,1],[0.136,e[1]-0.027,1]], m:"steel" });

  /* 이미터 하우징 (다크) */
  ZONES.push({ p:[[0.136,e[1]-0.027,1],[0.131,e[1]-0.038,1],
                  [0.118,e[1]-0.045,1],[0.118,e[1]-0.055,1],[0.000,e[1]-0.057,0]], m:"dark" });
})();
var EMIT_Y = pt(A5)[1]-0.055;      /* 부양 이미터 평면 */

/* ============================================================
   2. 구면 투영 패치 — 바이저·데칼이 곡률을 따라간다
   ============================================================ */
function spherePatch(Rp, A, B, expo, aSeg, rSeg, f0, f1){
  var pos=[], uv=[], idx=[], i, j;
  for(j=0;j<=rSeg;j++){
    var f=lerp(f0, f1, j/rSeg);
    for(i=0;i<=aSeg;i++){
      var th=2*Math.PI*i/aSeg, c=Math.cos(th), s=Math.sin(th);
      var px=A*sgn(c)*Math.pow(Math.abs(c), 2/expo)*f;
      var py=B*sgn(s)*Math.pow(Math.abs(s), 2/expo)*f;
      var v=new T.Vector3(px, py, Rp).normalize().multiplyScalar(Rp);
      pos.push(v.x, v.y, v.z);
      uv.push(0.5+px/(2*A), 0.5+py/(2*B));
    }
  }
  var row=aSeg+1;
  for(j=0;j<rSeg;j++) for(i=0;i<aSeg;i++){
    var a=j*row+i; idx.push(a,a+row,a+row+1, a,a+row+1,a+1);
  }
  var g=new T.BufferGeometry();
  g.setAttribute("position", new T.Float32BufferAttribute(pos,3));
  g.setAttribute("uv", new T.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}

/* ============================================================
   3. 텍스처
   ============================================================ */
function paintAlbedo(){
  var c=cv(1024,1024), g=c.getContext("2d");
  g.fillStyle="#d9d4c6"; g.fillRect(0,0,1024,1024);
  for(var i=0;i<1800;i++){
    g.fillStyle="rgba(120,112,96,"+(Math.random()*0.055)+")";
    g.beginPath(); g.arc(Math.random()*1024, Math.random()*1024, 5+Math.random()*54,0,6.283); g.fill();
  }
  var gd=g.createLinearGradient(0,520,0,1024);
  gd.addColorStop(0,"rgba(80,74,62,0)"); gd.addColorStop(1,"rgba(72,66,56,0.30)");
  g.fillStyle=gd; g.fillRect(0,520,1024,504);
  var gu=g.createLinearGradient(0,0,0,340);
  gu.addColorStop(0,"rgba(255,252,244,0.20)"); gu.addColorStop(1,"rgba(255,252,244,0)");
  g.fillStyle=gu; g.fillRect(0,0,1024,340);
  for(var s=0;s<300;s++){
    g.fillStyle="rgba(90,86,76,"+(0.10+Math.random()*0.30)+")";
    g.save(); g.translate(Math.random()*1024, Math.random()*1024); g.rotate(Math.random()*3.14);
    g.fillRect(0,0,2+Math.random()*20, 1+Math.random()*4); g.restore();
  }
  g.strokeStyle="rgba(96,90,80,0.5)"; g.lineWidth=3;
  [0.14,0.31,0.69,0.86].forEach(function(u){
    g.beginPath(); g.moveTo(u*1024,0); g.lineTo(u*1024,1024); g.stroke(); });
  return c;
}
function paintBump(){
  var c=cv(512,512), g=c.getContext("2d");
  var im=g.createImageData(512,512), d=im.data;
  for(var i=0;i<d.length;i+=4){ var n=128+(Math.random()-.5)*18; d[i]=d[i+1]=d[i+2]=n; d[i+3]=255; }
  g.putImageData(im,0,0);
  g.strokeStyle="rgba(56,56,56,0.95)"; g.lineWidth=3;
  [0.14,0.31,0.69,0.86].forEach(function(u){
    g.beginPath(); g.moveTo(u*512,0); g.lineTo(u*512,512); g.stroke(); });
  g.strokeStyle="rgba(180,180,180,0.35)"; g.lineWidth=1;
  for(var s=0;s<80;s++){ var x=Math.random()*512, y=Math.random()*512, l=8+Math.random()*60;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+l,y+(Math.random()-.5)*4); g.stroke(); }
  return c;
}
/* 데칼: 정면 LUMI */
function decalFront(){
  var c=cv(1024,512), g=c.getContext("2d");
  g.clearRect(0,0,1024,512);
  g.textAlign="center";
  g.fillStyle="#3b3831"; g.font="700 168px system-ui,sans-serif";
  g.fillText("LUMI", 512, 250);
  g.fillStyle="#6a655c"; g.font="500 46px system-ui,sans-serif";
  g.fillText("M A I N T E N A N C E   U N I T", 512, 316);
  return c;
}
/* 데칼: 후면 마킹 */
function decalBack(){
  var c=cv(1024,512), g=c.getContext("2d");
  g.clearRect(0,0,1024,512);
  g.textAlign="center"; g.fillStyle="#4a463f";
  g.beginPath(); g.moveTo(512,54); g.lineTo(556,132); g.lineTo(468,132); g.closePath(); g.fill();
  g.font="700 132px system-ui,sans-serif"; g.fillText("LUMI", 512, 282);
  g.fillStyle="#6a655c"; g.font="500 40px system-ui,sans-serif";
  g.fillText("MAINTENANCE UNIT", 512, 338);
  return c;
}
/* 데칼: 측면 그리블 */
function decalGreeble(){
  var c=cv(512,512), g=c.getContext("2d");
  g.clearRect(0,0,512,512);
  g.fillStyle="rgba(84,80,72,0.9)";
  for(var k=0;k<9;k++) g.fillRect(60, 90+k*30, 40+Math.random()*160, 11);
  g.font="500 34px ui-monospace,monospace"; g.fillStyle="rgba(96,92,84,0.95)";
  g.fillText("SEC 03 / A", 60, 420);
  g.fillText("UN 11", 60, 462);
  return c;
}
/* 방사형 글로우 */
function radialTex(){
  var c=cv(256,256), g=c.getContext("2d");
  var gr=g.createRadialGradient(128,128,0,128,128,128);
  gr.addColorStop(0.00,"rgba(255,255,255,1)");
  gr.addColorStop(0.28,"rgba(150,230,255,0.85)");
  gr.addColorStop(0.62,"rgba(70,180,230,0.28)");
  gr.addColorStop(1.00,"rgba(40,140,200,0)");
  g.fillStyle=gr; g.fillRect(0,0,256,256);
  return c;
}

/* ============================================================
   4. 렌더러 · 재질
   ============================================================ */
var stage=document.getElementById("stage");
var W=stage.clientWidth, H=stage.clientHeight;
var renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(W,H);
renderer.outputEncoding=T.sRGBEncoding;
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.02;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

var scene=new T.Scene();
scene.background=new T.Color(0x070809);
scene.fog=new T.Fog(0x070809,2.2,7.5);
var camera=new T.PerspectiveCamera(34,W/H,0.05,60);

(function(){
  var c=cv(256,128), g=c.getContext("2d");
  var gr=g.createLinearGradient(0,0,0,128);
  gr.addColorStop(0,"#54687a"); gr.addColorStop(.42,"#1d242a");
  gr.addColorStop(.56,"#0e1216"); gr.addColorStop(1,"#05070a");
  g.fillStyle=gr; g.fillRect(0,0,256,128);
  g.fillStyle="#b3c8d8"; g.fillRect(14,30,104,6);
  g.fillStyle="#75919f"; g.fillRect(160,44,58,3);
  var tex=new T.CanvasTexture(c);
  tex.mapping=T.EquirectangularReflectionMapping; tex.encoding=T.sRGBEncoding;
  var p=new T.PMREMGenerator(renderer);
  scene.environment=p.fromEquirectangular(tex).texture; p.dispose();
})();

var albedo=new T.CanvasTexture(paintAlbedo()); albedo.encoding=T.sRGBEncoding;
var bumpT =new T.CanvasTexture(paintBump()); bumpT.wrapS=bumpT.wrapT=T.RepeatWrapping;

var MAT={
  paint: new T.MeshPhysicalMaterial({ map:albedo, bumpMap:bumpT, bumpScale:0.0016,
          roughness:0.46, metalness:0.03, clearcoat:0.40, clearcoatRoughness:0.34, envMapIntensity:0.95 }),
  band:  new T.MeshStandardMaterial({ color:0x272b2f, roughness:0.78, metalness:0.22, envMapIntensity:0.8 }),
  steel: new T.MeshStandardMaterial({ color:0x8f969c, roughness:0.30, metalness:0.94, envMapIntensity:1.25 }),
  dark:  new T.MeshStandardMaterial({ color:0x0d1013, roughness:0.62, metalness:0.35 })
};
var matPanel=new T.MeshStandardMaterial({ color:0x15191d, roughness:0.36, metalness:0.60, envMapIntensity:1.15 });
var matCy=new T.MeshBasicMaterial({ color:0x62d8ff });
var matCyDim=new T.MeshBasicMaterial({ color:0x2f7f9e });

var glowTex=new T.CanvasTexture(radialTex());
var matGlowDisc=new T.MeshBasicMaterial({ map:glowTex, transparent:true, opacity:1.0,
  blending:T.AdditiveBlending, depthWrite:false, side:T.DoubleSide });
var matGlowHalo=new T.MeshBasicMaterial({ map:glowTex, transparent:true, opacity:0.45,
  blending:T.AdditiveBlending, depthWrite:false, side:T.DoubleSide });
var matGlowCone=new T.MeshBasicMaterial({ color:0x4fc4ee, transparent:true, opacity:0.10,
  blending:T.AdditiveBlending, depthWrite:false, side:T.DoubleSide });

var rig=new T.Group(), body=new T.Group();
rig.add(body); scene.add(rig);
var vcount=0, tcount=0;
function add(parent, geo, mat, shadow){
  var m=new T.Mesh(geo, mat); m.castShadow=shadow!==false; parent.add(m);
  vcount+=geo.attributes.position.count;
  tcount+=(geo.index?geo.index.count:geo.attributes.position.count)/3;
  return m;
}

/* ---- 몸통 존 ---- */
(function(){
  var lens=ZONES.map(function(z){
    var t=0; for(var i=1;i<z.p.length;i++) t+=Math.hypot(z.p[i][0]-z.p[i-1][0], z.p[i][1]-z.p[i-1][1]);
    return t;
  });
  var tot=lens.reduce(function(a,b){return a+b;},0), acc=0;
  ZONES.forEach(function(z,i){
    var v0=acc/tot; acc+=lens[i]; var v1=acc/tot;
    add(body, lathe(z.p, 56, v0, v1), MAT[z.m]);
  });
})();

/* ============================================================
   5. 바이저 — 구면 투영 패치, 불투명
   ============================================================ */
var VIS_TILT=-0.26, VA=0.132, VB=0.072, VEXPO=3.2;
var visor=new T.Group(); visor.rotation.x=VIS_TILT; body.add(visor);

/* 베젤 (링) */
add(visor, spherePatch(0.2265, VA, VB, VEXPO, 72, 3, 1.00, 1.19), matPanel, false);
/* 베젤 외곽 안쪽 어두운 턱 */
add(visor, spherePatch(0.2240, VA, VB, VEXPO, 72, 2, 0.99, 1.02), MAT.dark, false);

/* 디스플레이 — 불투명 */
var DW=512, DH=280;
var faceCv=cv(DW,DH), fx=faceCv.getContext("2d");
var faceTex=new T.CanvasTexture(faceCv); faceTex.encoding=T.sRGBEncoding;
var matFace=new T.MeshBasicMaterial({ map:faceTex });
add(visor, spherePatch(0.2235, VA, VB, VEXPO, 64, 8, 0.002, 1.0), matFace, false);

/* ---- 데칼 패치 ---- */
function decalMat(canvasEl){
  var t=new T.CanvasTexture(canvasEl); t.encoding=T.sRGBEncoding;
  return new T.MeshStandardMaterial({ map:t, transparent:true, roughness:0.5, metalness:0.0,
    envMapIntensity:0.7, polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2 });
}
(function(){
  var f=new T.Group(); f.rotation.x=0.36; body.add(f);
  add(f, spherePatch(0.2228, 0.088, 0.044, 2.0, 40, 4, 0.002, 1.0), decalMat(decalFront()), false);

  var b=new T.Group(); b.rotation.y=Math.PI; b.rotation.x=-0.08; body.add(b);
  add(b, spherePatch(0.2228, 0.082, 0.041, 2.0, 40, 4, 0.002, 1.0), decalMat(decalBack()), false);

  var gm=decalMat(decalGreeble());
  [-1,1].forEach(function(s){
    var q=new T.Group(); q.rotation.y=s*0.72; q.rotation.x=0.02; body.add(q);
    add(q, spherePatch(0.2228, 0.040, 0.040, 2.0, 24, 4, 0.002, 1.0), gm, false);
  });
})();

/* 바이저 위 상태 LED / 정면 포인트 LED */
var topLed=add(body, new T.BoxGeometry(0.018,0.009,0.006), matCy, false);
(function(){ var d=new T.Vector3(0,0.36,0.93).normalize().multiplyScalar(0.224);
  topLed.position.copy(d); topLed.lookAt(d.clone().multiplyScalar(2)); })();
var dotLed=add(body, new T.CircleGeometry(0.009,16), matCy, false);
(function(){ var d=new T.Vector3(0.30,-0.30,0.905).normalize().multiplyScalar(0.2235);
  dotLed.position.copy(d); dotLed.lookAt(d.clone().multiplyScalar(2)); })();

/* ============================================================
   6. 측면 포드 — 패널 재질(디스플레이와 동일 계열)
   ============================================================ */
function roundRectShape(w,h,r){
  var s=new T.Shape(), x=w/2, y=h/2;
  s.moveTo(-x+r,-y); s.lineTo(x-r,-y); s.quadraticCurveTo(x,-y,x,-y+r);
  s.lineTo(x,y-r); s.quadraticCurveTo(x,y,x-r,y);
  s.lineTo(-x+r,y); s.quadraticCurveTo(-x,y,-x,y-r);
  s.lineTo(-x,-y+r); s.quadraticCurveTo(-x,-y,-x+r,-y);
  s.closePath(); return s;
}
(function(){
  var hoop=roundRectShape(0.116,0.150,0.055);
  hoop.holes.push(roundRectShape(0.078,0.110,0.038));
  var hoopGeo=new T.ExtrudeGeometry(hoop,{depth:0.056, bevelEnabled:true,
    bevelThickness:0.005, bevelSize:0.005, bevelSegments:2, curveSegments:16});
  var hole=new T.CircleGeometry(0.0095,12);
  [-1,1].forEach(function(s){

    g.rotation.y=s*Math.PI/2;

    for(var k=0;k<4;k++){
      var a=k/4*Math.PI*2+0.78;

      h.position.set(0.021*Math.cos(a), 0.021*Math.sin(a), 0.060);

    var slit=add(g, new T.BoxGeometry(0.004,0.032,0.003), matCyDim, false);
    slit.position.set(0,0.064,0.032);
  });
})();

/* ============================================================
   10. 디스플레이 10종 (불투명)
   ============================================================ */
var CX=DW/2, CY=DH/2, CYAN="#69dbff", RED="#ff5a4a";
function begin(){ fx.fillStyle="#05090c"; fx.fillRect(0,0,DW,DH);
  var g2=fx.createRadialGradient(CX,CY*0.5,10,CX,CY,DW*0.7);
  g2.addColorStop(0,"rgba(60,90,110,0.16)"); g2.addColorStop(1,"rgba(0,0,0,0)");
  fx.fillStyle=g2; fx.fillRect(0,0,DW,DH); }
function end(){ fx.globalAlpha=1;
  fx.fillStyle="rgba(0,0,0,.22)";
  for(var y=0;y<DH;y+=3) fx.fillRect(0,y,DW,1);
  faceTex.needsUpdate=true; }
function glow(c){ fx.shadowColor=c||CYAN; fx.shadowBlur=20; fx.fillStyle=c||CYAN; fx.strokeStyle=c||CYAN; }
function eyes(w,h,al){ glow(); fx.globalAlpha=al===undefined?1:al;
  [-1,1].forEach(function(s){ fx.fillRect(CX+s*58-w/2, CY-h/2, w, h); });
  fx.globalAlpha=1; fx.shadowBlur=0; }

var DISPLAYS={
  idle:{label:"기본 상태",draw:function(t){ begin(); eyes(34,34); end(); }},
  scan:{label:"스캔 중",draw:function(t){ begin(); glow();
    fx.font="600 48px ui-monospace,monospace"; fx.textAlign="center";
    fx.fillText("-- SCAN --", CX, CY+17);
    fx.globalAlpha=0.32; fx.fillRect(24, CY+46+Math.sin(t*3)*24, DW-48, 3);
    fx.globalAlpha=1; fx.shadowBlur=0; end(); }},
  calc:{label:"계산 중",draw:function(t){ begin(); glow();
    for(var k=0;k<3;k++){ fx.globalAlpha=((Math.floor(t*3)%3)===k)?1:0.26;
      fx.fillRect(CX-60+k*50, CY-12, 24, 24); }
    fx.globalAlpha=1; fx.shadowBlur=0; end(); }},
  pulse:{label:"맥박 확인",draw:function(t){ begin(); glow();
    fx.lineWidth=5; fx.lineJoin="round"; fx.beginPath();
    var ph=(t*0.8)%1;
    for(var i=0;i<=140;i++){
      var x=i/140, px=28+x*(DW-56), d=((x-ph)+1)%1, yy=CY;
      if(d>0.44&&d<0.47) yy=CY+18; else if(d>=0.47&&d<0.50) yy=CY-58;
      else if(d>=0.50&&d<0.53) yy=CY+34; else if(d>=0.53&&d<0.56) yy=CY-6;
      if(i===0) fx.moveTo(px,yy); else fx.lineTo(px,yy);
    }
    fx.stroke(); fx.shadowBlur=0; end(); }},
  count:{label:"숫자 카운트",draw:function(t){ begin(); glow();
    fx.textAlign="center"; fx.font="600 82px ui-monospace,monospace";
    fx.fillText((88+Math.floor(t*4)%9)+"", CX+44, CY+28);
    fx.font="600 44px ui-monospace,monospace"; fx.globalAlpha=0.5;
    fx.fillText("2", CX-104, CY+24); fx.globalAlpha=1; fx.shadowBlur=0; end(); }},
  warn:{label:"위험 감지",draw:function(t){ begin(); glow(RED);
    fx.globalAlpha=0.45+0.55*Math.abs(Math.sin(t*4));
    fx.lineWidth=8; fx.lineJoin="round"; fx.beginPath();
    fx.moveTo(CX,CY-52); fx.lineTo(CX+56,CY+44); fx.lineTo(CX-56,CY+44); fx.closePath(); fx.stroke();
    fx.fillRect(CX-5,CY-14,10,32); fx.fillRect(CX-5,CY+26,10,9);
    fx.globalAlpha=1; fx.shadowBlur=0; end(); }},
  power:{label:"잔량 표시",draw:function(t){ begin(); glow();
    fx.textAlign="left"; fx.font="600 58px ui-monospace,monospace";
    fx.fillText("17%", CX-152, CY+20);
    fx.lineWidth=5; fx.strokeRect(CX+22, CY-26, 112, 50);
    fx.fillRect(CX+136, CY-11, 9, 22);
    fx.globalAlpha=0.9; fx.fillRect(CX+29, CY-19, 20, 36);
    fx.globalAlpha=1; fx.shadowBlur=0; end(); }},
  door:{label:"문 제어 중",draw:function(t){ begin(); glow();
    fx.textAlign="center"; fx.font="600 50px ui-monospace,monospace";
    fx.fillText("OPEN", CX, CY+17);
    var o=Math.sin(t*4)*9;
    fx.beginPath(); fx.moveTo(CX-112-o,CY); fx.lineTo(CX-84-o,CY-20); fx.lineTo(CX-84-o,CY+20); fx.closePath(); fx.fill();
    fx.beginPath(); fx.moveTo(CX+112+o,CY); fx.lineTo(CX+84+o,CY-20); fx.lineTo(CX+84+o,CY+20); fx.closePath(); fx.fill();
    fx.shadowBlur=0; end(); }},
  countdown:{label:"카운트다운",draw:function(t){ begin(); glow();
    var n=Math.max(0,90-Math.floor(t));
    fx.textAlign="center"; fx.font="600 104px ui-monospace,monospace";
    fx.globalAlpha=(t%1)<0.16?1:0.7; fx.fillText(n+"", CX, CY+36);
    fx.globalAlpha=1; fx.shadowBlur=0; end(); }},
  dying:{label:"전력 종료 직전",draw:function(t){ begin(); eyes(22,22,0.26); end(); }}
};
var ROW1=["idle","scan","calc","pulse","count"], ROW2=["warn","power","door","countdown","dying"];

/* 엔딩 5단계 */
var SEQ=[
  {at:0.0,disp:"idle",     light:1,lift:1,tag:"1. 도킹 시작"},
  {at:2.0,disp:"connected",light:1,lift:1,tag:"2. 접속 완료"},
  {at:4.2,disp:"connected",light:0,lift:1,tag:"3. 라이트 소등"},
  {at:6.2,disp:"fading",   light:0,lift:0,tag:"4. 디스플레이 어두워짐"},
  {at:8.4,disp:"lastled",  light:0,lift:0,tag:"5. 마지막 상태 LED 점멸"}
];
function drawSeq(s, st){
  if(s==="connected"){ begin(); eyes(34,34); glow();
    for(var k=0;k<5;k++){ fx.globalAlpha=((st*6|0)%5===k)?1:0.32;
      fx.fillRect(CX-62+k*28, CY+62, 18, 8); }
    fx.globalAlpha=1; fx.shadowBlur=0; end();
  } else if(s==="fading"){ begin(); eyes(24,24, clamp(1-st/2.0,0.03,1)*0.5); end();
  } else if(s==="lastled"){ begin(); glow();
    fx.globalAlpha=(st%1.4)<0.16?0.95:0.03;
    fx.beginPath(); fx.arc(CX, CY+66, 8, 0, 6.283); fx.fill();
    fx.globalAlpha=1; fx.shadowBlur=0; end(); }
}

/* ============================================================
   11. 상태 · 루프
   ============================================================ */
var L={pos:new T.Vector3(),vel:new T.Vector3(),target:new T.Vector3(),
       yaw:0,pitch:0,roll:0,yawV:0,pitchV:0,bobT:0,t:0,
       lift:1,sag:0,hold:0,light:1,moving:false,disp:"idle",seq:-1};
function wrapPi(a){ while(a>Math.PI)a-=6.283185; while(a<-Math.PI)a+=6.283185; return a; }
function sdamp(cur,goal,o,k,sm,dt){
  var w=2/Math.max(sm,1e-4), x=w*dt, ex=1/(1+x+0.48*x*x+0.235*x*x*x);
  var ch=wrapPi(cur-goal), tmp=(o[k]+w*ch)*dt;
  o[k]=(o[k]-w*tmp)*ex; return goal+(ch+tmp)*ex;
}
var wander=0, ORIGIN=new T.Vector3(), tmpV=new T.Vector3(), fwd=new T.Vector3(), lp=new T.Vector3();

function update(dt){
  L.t+=dt;
  var wantLight=1, wantLift=1, ss=null, sl=0, tag=null;
  if(L.seq>=0){
    L.seq+=dt; var s=SEQ[0];
    for(var i=0;i<SEQ.length;i++) if(L.seq>=SEQ[i].at) s=SEQ[i];
    wantLight=s.light; wantLift=s.lift; ss=s.disp; sl=L.seq-s.at; tag=s.tag;
    if(L.seq>14) L.seq=0;
  }
  if(L.moving && L.seq<0){
    wander+=dt;
    L.target.set(Math.sin(wander*0.55)*0.5, Math.sin(wander*0.31)*0.1, Math.cos(wander*0.42)*0.3);
    ["x","y","z"].forEach(function(ax){
      L.vel[ax]+=(L.target[ax]-L.pos[ax])*6*dt; L.vel[ax]*=Math.pow(0.06,dt);
      L.vel[ax]=clamp(L.vel[ax],-1.2,1.2); L.pos[ax]+=L.vel[ax]*dt; });
  } else {
    ["x","y","z"].forEach(function(ax){ L.vel[ax]*=Math.pow(0.02,dt); });
    L.pos.lerp(ORIGIN,1-Math.pow(0.15,dt));
  }
  if(L.hold>0){ L.hold-=dt; wantLift=0; }
  L.lift=lerp(L.lift,wantLift,1-Math.pow(0.004,dt));
  L.sag=lerp(L.sag,(1-L.lift)*0.085,1-Math.pow(0.02,dt));
  L.light=lerp(L.light,wantLight,1-Math.pow(0.0015,dt));

  L.bobT+=dt;
  var bob=(0.026*Math.sin(L.bobT*2.62)+0.007*Math.sin(L.bobT*3.70))*L.lift - L.sag;
  var dx=camera.position.x-L.pos.x, dy=camera.position.y-(L.pos.y+bob), dz=camera.position.z-L.pos.z;
  L.yaw=sdamp(L.yaw,Math.atan2(dx,dz),L,"yawV",0.20,dt);
  L.pitch=sdamp(L.pitch,-Math.atan2(dy,Math.hypot(dx,dz)),L,"pitchV",0.24,dt);
  var rv=L.vel.x*Math.cos(L.yaw)-L.vel.z*Math.sin(L.yaw);
  L.roll=lerp(L.roll,clamp(-rv*0.30,-0.32,0.32),1-Math.pow(0.001,dt));

  rig.position.set(L.pos.x, L.pos.y+bob, L.pos.z);
  body.rotation.set(L.pitch,L.yaw,L.roll,"YXZ");

  var pulse=0.92+0.08*Math.sin(L.t*5.2);
  matGlowDisc.opacity=1.0*L.lift*pulse;
  matGlowHalo.opacity=0.45*L.lift*pulse;
  matGlowCone.opacity=0.10*L.lift*pulse;
  glowGroup.visible=L.lift>0.01;
  liftLight.intensity=1.7*L.lift;
  matCy.color.setRGB(0.38*L.light,0.85*L.light,1.0*L.light);
  matCyDim.color.setRGB(0.18*L.lift,0.50*L.lift,0.62*L.lift);

  if(ss) drawSeq(ss,sl); else DISPLAYS[L.disp].draw(L.t);

  fwd.set(0,Math.sin(-VIS_TILT),Math.cos(VIS_TILT)).applyEuler(body.rotation).normalize();
  lp.set(0,0.06,0.21).applyEuler(body.rotation).add(rig.position);
  spot.position.copy(lp);
  spotTarget.position.copy(lp).addScaledVector(fwd,6);
  spot.intensity=2.4*L.light;
  beam.visible=L.light>0.03;
  if(beam.visible){
    var reach=4.5, r=Math.tan(spot.angle)*reach;
    beam.scale.set(r,reach,r);
    beam.position.copy(lp).addScaledVector(fwd,reach/2);
    beam.quaternion.setFromUnitVectors(tmpV.set(0,-1,0),fwd);
    beam.material.opacity=0.03*L.light;
  }
  return tag;
}

/* ============================================================
   12. 카메라 · UI
   ============================================================ */
var orbit={theta:0.34,phi:1.46,dist:1.0,auto:true};
function placeCamera(){
  camera.position.set(
    orbit.dist*Math.sin(orbit.phi)*Math.sin(orbit.theta),
    orbit.dist*Math.cos(orbit.phi),
    orbit.dist*Math.sin(orbit.phi)*Math.cos(orbit.theta));
  camera.lookAt(0,0.01,0);
}
var dragging=false,lx=0,ly=0;
stage.addEventListener("pointerdown",function(e){ dragging=true; lx=e.clientX; ly=e.clientY;
  stage.classList.add("dragging"); stage.setPointerCapture(e.pointerId); });
stage.addEventListener("pointermove",function(e){ if(!dragging)return;
  orbit.theta-=(e.clientX-lx)*0.008;
  orbit.phi=clamp(orbit.phi-(e.clientY-ly)*0.008,0.35,2.6);
  lx=e.clientX; ly=e.clientY; });
stage.addEventListener("pointerup",function(e){ dragging=false;
  stage.classList.remove("dragging"); stage.releasePointerCapture(e.pointerId); });
stage.addEventListener("wheel",function(e){ e.preventDefault();
  orbit.dist=clamp(orbit.dist+e.deltaY*0.0012,0.48,4.0); },{passive:false});

var allBtns=[];
function mkRow(id,keys){
  var el=document.getElementById(id);
  keys.forEach(function(k){
    var b=document.createElement("button"); b.textContent=DISPLAYS[k].label;
    b.setAttribute("aria-pressed", k===L.disp?"true":"false");
    b.addEventListener("click",function(){ L.disp=k; L.seq=-1; L.t=0;
      allBtns.forEach(function(o){ o.setAttribute("aria-pressed", o===b?"true":"false"); });
      document.getElementById("r-state").textContent=DISPLAYS[k].label; });
    el.appendChild(b); allBtns.push(b);
  });
}
mkRow("row1",ROW1); mkRow("row2",ROW2);
document.getElementById("ending").addEventListener("click",function(){
  L.seq=0; allBtns.forEach(function(o){ o.setAttribute("aria-pressed","false"); }); });
document.getElementById("silence").addEventListener("click",function(){ L.hold=0.5; });
var moveBtn=document.getElementById("moving");
moveBtn.addEventListener("click",function(){ L.moving=!L.moving;
  moveBtn.setAttribute("aria-pressed", L.moving?"true":"false"); });
var spinBtn=document.getElementById("spin");
spinBtn.addEventListener("click",function(){ orbit.auto=!orbit.auto;
  spinBtn.setAttribute("aria-pressed", orbit.auto?"true":"false"); });
var wireBtn=document.getElementById("wire");
wireBtn.addEventListener("click",function(){
  var on=wireBtn.getAttribute("aria-pressed")!=="true";
  wireBtn.setAttribute("aria-pressed", on?"true":"false");
  [MAT.paint,MAT.band,MAT.steel,MAT.dark,matPanel].forEach(function(m){ m.wireframe=on; }); });
var lightBtn=document.getElementById("lights");
lightBtn.addEventListener("click",function(){
  var off=lightBtn.getAttribute("aria-pressed")!=="true";
  lightBtn.setAttribute("aria-pressed", off?"true":"false");
  shipLights.forEach(function(l){ l.visible=!off; });
  amb.intensity= off?0.10:0.72; });

document.getElementById("r-verts").textContent=vcount.toLocaleString();
document.getElementById("r-tris").textContent=Math.round(tcount).toLocaleString();
document.getElementById("r-state").textContent="기본 상태";

window.addEventListener("resize",function(){
  W=stage.clientWidth; H=stage.clientHeight;
  camera.aspect=W/H; camera.updateProjectionMatrix(); renderer.setSize(W,H); });

var prev=performance.now(), acc=0;
var rLift=document.getElementById("r-lift"), rState=document.getElementById("r-state");
function frame(now){
  var dt=Math.min((now-prev)/1000,0.05); prev=now;
  if(orbit.auto && !dragging) orbit.theta+=dt*0.15;
  placeCamera();
  var tag=update(dt);
  acc+=dt;
  if(acc>0.12){ acc=0; rLift.textContent=Math.round(L.lift*100)+"%";
    if(tag) rState.textContent=tag; }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
placeCamera(); requestAnimationFrame(frame);
})();
</script>
