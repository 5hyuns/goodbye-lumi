<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>루미 v4 — 컨셉 반영</title>
<style>
  :root { --void:#0a0c0e; --steel:#14181c; --edge:#232a30; --dim:#6d7780; --read:#b9c2c9; --cy:#5fd0f5; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--void); color:var(--read);
         font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;
         font-size:14px; line-height:1.6; }
  .wrap { max-width:940px; margin:0 auto; padding:24px 20px 40px; }
  h1 { font-size:17px; font-weight:500; margin:0 0 2px; color:#e6ebef; letter-spacing:-.01em; }
  .sub { color:var(--dim); font-size:13px; margin:0 0 18px; }
  #stage { position:relative; height:520px; border:1px solid var(--edge); border-radius:3px;
           overflow:hidden; background:#070809; cursor:grab; }
  #stage.dragging { cursor:grabbing; }
  #stage canvas { display:block; }
  .hint { position:absolute; left:12px; bottom:10px; color:#45505a; font-size:12px; pointer-events:none; }
  .rail { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; align-items:center; }
  .rail .lbl { color:var(--dim); font-size:12px; margin-right:4px; min-width:64px; }
  button { font:inherit; font-size:13px; color:var(--read); background:var(--steel);
           border:1px solid var(--edge); border-radius:2px; padding:6px 11px; cursor:pointer;
           transition:border-color .12s,color .12s; }
  button:hover { border-color:#3a444d; color:#e6ebef; }
  button:focus-visible { outline:2px solid var(--cy); outline-offset:1px; }
  button[aria-pressed="true"] { border-color:var(--cy); color:var(--cy); }
  #ending { border-color:#4a5560; }
  .readout { margin-top:16px; border-top:1px solid var(--edge); padding-top:14px;
             display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:4px 20px; }
  .readout div { display:flex; justify-content:space-between; gap:10px; }
  .readout span:first-child { color:var(--dim); }
  .readout span:last-child { font-variant-numeric:tabular-nums; }
  .note { margin-top:20px; padding-top:14px; border-top:1px solid var(--edge);
          color:var(--dim); font-size:13px; max-width:64ch; }
  .note b { color:var(--read); font-weight:500; }
</style>
</head>
<body>
<div class="wrap">
  <h1>루미 v4 — 컨셉 반영</h1>
  <p class="sub">구체 바디, 와이드 바이저, 측면 포드, 하부 부양 디스크. 메시·텍스처 전부 코드 생성.</p>

  <div id="stage"><p class="hint">드래그 회전 · 휠 확대</p></div>

  <div class="rail" id="row1"><span class="lbl">디스플레이</span></div>
  <div class="rail" id="row2"><span class="lbl"></span></div>
  <div class="rail">
    <span class="lbl">연출</span>
    <button id="ending">엔딩 도킹 시퀀스 재생</button>
    <button id="silence">0.5초 침묵</button>
    <button id="moving" aria-pressed="false">이동 중</button>
  </div>
  <div class="rail">
    <span class="lbl">뷰</span>
    <button id="spin" aria-pressed="true">자동 회전</button>
    <button id="wire" aria-pressed="false">와이어프레임</button>
    <button id="lights" aria-pressed="false">함선 조명 끄기</button>
  </div>

  <div class="readout">
    <div><span>정점</span><span id="r-verts">—</span></div>
    <div><span>삼각형</span><span id="r-tris">—</span></div>
    <div><span>부양 출력</span><span id="r-lift">—</span></div>
    <div><span>상태</span><span id="r-state">—</span></div>
  </div>

  <p class="note">
    <b>엔딩 시퀀스</b>는 시트의 5단계를 그대로 재생합니다 — 도킹 시작, 접속 완료, 라이트 소등,
    디스플레이 어두워짐, 마지막 LED 점멸. 부양 디스크도 같이 죽으면서 루미가 가라앉습니다.
    <b>함선 조명 끄기</b>로 게임 실제 조명 조건에서 실루엣을 확인하세요.
  </p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
var T = THREE;
function cv(w,h){ var c=document.createElement("canvas"); c.width=w; c.height=h; return c; }
function clamp(x,a,b){ return x<a?a:(x>b?b:x); }
function lerp(a,b,t){ return a+(b-a)*t; }

/* ============================================================
   1. 프로파일 — 구체 + 시임 홈 + 하단 플랜지
   ============================================================ */
var R = 0.222, YS = 0.97;
var SEAMS = [0.46, 2.02];          /* 홈이 들어갈 극각(rad) */
var A_END = 2.34;

function buildProfile(){
  var list = [], i;
  for(i=0;i<=32;i++) list.push(A_END*i/32);
  SEAMS.forEach(function(s){ list.push(s-0.036, s-0.030, s+0.030, s+0.036); });
  list.sort(function(a,b){ return a-b; });

  var p = [];
  list.forEach(function(a){
    var dip = 0, hard = 0;
    SEAMS.forEach(function(s){ if(Math.abs(a-s) < 0.033){ dip = 0.0065; hard = 1; } });
    p.push([ R*Math.sin(a) - dip, R*YS*Math.cos(a), hard ]);
  });
  /* 하단 플랜지 → 부양 디스크 리세스 */
  p.push([0.158,-0.153,1],[0.166,-0.160,1],[0.162,-0.172,1],
         [0.134,-0.178,1],[0.130,-0.188,1],[0.116,-0.194,1],
         [0.116,-0.203,1],[0.000,-0.205,0]);
  return p;
}
var PROFILE = buildProfile();

/* y → v (텍스처 세로 좌표). 데칼을 정확한 위도에 찍기 위해 미리 계산. */
var VLUT = (function(){
  var acc=[0], tot=0, i;
  for(i=1;i<PROFILE.length;i++){
    tot += Math.hypot(PROFILE[i][0]-PROFILE[i-1][0], PROFILE[i][1]-PROFILE[i-1][1]);
    acc.push(tot);
  }
  return { ys: PROFILE.map(function(p){ return p[1]; }),
           vs: acc.map(function(a){ return a/tot; }) };
})();
function vOf(y){
  for(var i=1;i<VLUT.ys.length;i++){
    if(y >= VLUT.ys[i]){
      var t=(VLUT.ys[i-1]-y)/(VLUT.ys[i-1]-VLUT.ys[i]);
      return lerp(VLUT.vs[i-1], VLUT.vs[i], t);
    }
  }
  return 1;
}
function rOf(y){
  for(var i=1;i<VLUT.ys.length;i++){
    if(y >= VLUT.ys[i]){
      var t=(VLUT.ys[i-1]-y)/(VLUT.ys[i-1]-VLUT.ys[i]);
      return lerp(PROFILE[i-1][0], PROFILE[i][0], t);
    }
  }
  return 0.01;
}

/* ============================================================
   2. 절차적 텍스처 — 본톤 도장, 때, 데칼
   ============================================================ */
var TW = 2048, TH = 1024;
/* u=0.5 가 정면(+Z). 가로 픽셀/미터는 위도마다 다르므로 데칼마다 보정한다. */
function uxOf(y){ return TW / (2*Math.PI*Math.max(rOf(y),0.02)); }   /* px per meter, 가로 */
var PY = TH / (function(){ var t=0; for(var i=1;i<PROFILE.length;i++)
  t+=Math.hypot(PROFILE[i][0]-PROFILE[i-1][0],PROFILE[i][1]-PROFILE[i-1][1]); return t; })();

function bodyAlbedo(){
  var c=cv(TW,TH), g=c.getContext("2d");
  g.fillStyle="#d9d4c6"; g.fillRect(0,0,TW,TH);

  /* 얼룩 */
  for(var i=0;i<2400;i++){
    g.fillStyle="rgba(122,114,98,"+(Math.random()*0.055)+")";
    g.beginPath(); g.arc(Math.random()*TW, Math.random()*TH, 6+Math.random()*70, 0, 6.283); g.fill();
  }
  /* 아래쪽 오염 */
  var grd=g.createLinearGradient(0,TH*0.55,0,TH);
  grd.addColorStop(0,"rgba(84,78,66,0)"); grd.addColorStop(1,"rgba(74,68,58,0.30)");
  g.fillStyle=grd; g.fillRect(0,TH*0.55,TW,TH*0.45);
  /* 상부 반사광 쪽은 살짝 밝게 */
  var grd2=g.createLinearGradient(0,0,0,TH*0.35);
  grd2.addColorStop(0,"rgba(255,252,244,0.22)"); grd2.addColorStop(1,"rgba(255,252,244,0)");
  g.fillStyle=grd2; g.fillRect(0,0,TW,TH*0.35);

  /* 페인트 벗겨짐 */
  for(var s=0;s<260;s++){
    g.fillStyle="rgba(92,88,80,"+(0.10+Math.random()*0.30)+")";
    var x=Math.random()*TW, y=Math.random()*TH, w=2+Math.random()*22, h=1+Math.random()*4;
    g.save(); g.translate(x,y); g.rotate(Math.random()*3.14);
    g.fillRect(0,0,w,h); g.restore();
  }
  /* 세로 패널 분할선 */
  g.strokeStyle="rgba(96,90,80,0.55)"; g.lineWidth=3;
  [0.16,0.30,0.70,0.84].forEach(function(u){
    g.beginPath(); g.moveTo(u*TW, TH*0.18); g.lineTo(u*TW, TH*0.86); g.stroke(); });

  /* ---- 정면 데칼: LUMI / MAINTENANCE UNIT ---- */
  (function(){
    var y=-0.062, v=vOf(y), sx=uxOf(y)/PY;   /* 가로 방향 보정 계수 */
    g.save(); g.translate(TW*0.5, v*TH); g.scale(sx,1);
    g.fillStyle="#3d3a34"; g.textAlign="center";
    g.font="700 74px system-ui,sans-serif";
    g.fillText("LUMI", 0, 0);
    g.font="500 24px system-ui,sans-serif"; g.fillStyle="#6a655c";
    g.fillText("M A I N T E N A N C E   U N I T", 0, 30);
    g.restore();
  })();

  /* ---- 정면 좌우 그리블 (얇은 눈금·코드) ---- */
  (function(){
    var y=0.030, v=vOf(y), sx=uxOf(y)/PY;
    [-1,1].forEach(function(sd){
      g.save(); g.translate(TW*0.5 + sd*TW*0.088, v*TH); g.scale(sx,1);
      g.fillStyle="rgba(88,84,76,0.85)";
      for(var k=0;k<7;k++) g.fillRect(-14, k*11, 4+Math.random()*22, 4);
      g.font="500 16px ui-monospace,monospace"; g.fillStyle="rgba(96,92,84,0.9)";
      g.fillText("SEC 03 / A", -14, 95);
      g.restore();
    });
  })();

  /* ---- 후면: LUMI + 삼각 마킹 ---- */
  (function(){
    var y=0.020, v=vOf(y), sx=uxOf(y)/PY;
    [0, TW].forEach(function(cx){
      g.save(); g.translate(cx, v*TH); g.scale(sx,1);
      g.fillStyle="#4a463f"; g.textAlign="center";
      g.font="700 56px system-ui,sans-serif"; g.fillText("LUMI", 0, 40);
      g.font="500 20px system-ui,sans-serif"; g.fillStyle="#6a655c";
      g.fillText("MAINTENANCE UNIT", 0, 66);
      g.beginPath(); g.moveTo(0,-34); g.lineTo(20,2); g.lineTo(-20,2); g.closePath();
      g.fillStyle="#4a463f"; g.fill();
      g.restore();
    });
  })();
  return c;
}

function bodyBump(){
  var c=cv(1024,512), g=c.getContext("2d");
  var img=g.createImageData(1024,512), d=img.data;
  for(var i=0;i<d.length;i+=4){ var n=128+(Math.random()-.5)*18; d[i]=d[i+1]=d[i+2]=n; d[i+3]=255; }
  g.putImageData(img,0,0);
  g.strokeStyle="rgba(58,58,58,0.95)"; g.lineWidth=3;
  [0.16,0.30,0.70,0.84].forEach(function(u){
    g.beginPath(); g.moveTo(u*1024, 90); g.lineTo(u*1024, 440); g.stroke(); });
  g.strokeStyle="rgba(170,170,170,0.4)"; g.lineWidth=1;
  for(var s=0;s<70;s++){ var x=Math.random()*1024, y=Math.random()*512, l=10+Math.random()*70;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+l, y+(Math.random()-.5)*5); g.stroke(); }
  return c;
}

/* ============================================================
   3. 렌더러 · 재질
   ============================================================ */
var stage=document.getElementById("stage");
var W=stage.clientWidth, H=stage.clientHeight;
var renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(W,H);
renderer.outputEncoding=T.sRGBEncoding;
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.02;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

var scene=new T.Scene();
scene.background=new T.Color(0x070809);
scene.fog=new T.Fog(0x070809, 2.2, 7.5);
var camera=new T.PerspectiveCamera(34, W/H, 0.05, 60);

(function(){
  var c=cv(256,128), g=c.getContext("2d");
  var gr=g.createLinearGradient(0,0,0,128);
  gr.addColorStop(0,"#54687a"); gr.addColorStop(.42,"#1d242a");
  gr.addColorStop(.56,"#0e1216"); gr.addColorStop(1,"#05070a");
  g.fillStyle=gr; g.fillRect(0,0,256,128);
  g.fillStyle="#b3c8d8"; g.fillRect(14,30,104,6);
  g.fillStyle="#75919f"; g.fillRect(160,44,58,3);
  var tex=new T.CanvasTexture(c);
  tex.mapping=T.EquirectangularReflectionMapping; tex.encoding=T.sRGBEncoding;
  var p=new T.PMREMGenerator(renderer);
  scene.environment=p.fromEquirectangular(tex).texture; p.dispose();
})();

var albedo=new T.CanvasTexture(bodyAlbedo()); albedo.encoding=T.sRGBEncoding;
var bump=new T.CanvasTexture(bodyBump()); bump.wrapS=bump.wrapT=T.RepeatWrapping;

var matPaint=new T.MeshPhysicalMaterial({ map:albedo, bumpMap:bump, bumpScale:0.0016,
  roughness:0.46, metalness:0.03, clearcoat:0.42, clearcoatRoughness:0.35, envMapIntensity:0.95 });
var matGraphite=new T.MeshStandardMaterial({ color:0x1b1f23, roughness:0.44, metalness:0.68, envMapIntensity:1.1 });
var matDark=new T.MeshStandardMaterial({ color:0x0b0e11, roughness:0.68, metalness:0.3 });
var matSteel=new T.MeshStandardMaterial({ color:0x9aa1a7, roughness:0.28, metalness:0.95, envMapIntensity:1.2 });
var matGlass=new T.MeshPhysicalMaterial({ color:0x04070a, roughness:0.04, metalness:0.15,
  clearcoat:1, clearcoatRoughness:0.02, transparent:true, opacity:0.42, envMapIntensity:1.6 });
var matCy=new T.MeshBasicMaterial({ color:0x62d8ff });
var matCyDim=new T.MeshBasicMaterial({ color:0x2f7f9e });
var matLift=new T.MeshBasicMaterial({ color:0x62d8ff, transparent:true, opacity:0.95 });
var matHalo=new T.MeshBasicMaterial({ color:0x3fb4e0, transparent:true, opacity:0.30,
  side:T.DoubleSide, depthWrite:false, blending:T.AdditiveBlending });

var rig=new T.Group(), body=new T.Group();
rig.add(body); scene.add(rig);
var vcount=0, tcount=0;
function add(parent, geo, mat, shadow){
  var m=new T.Mesh(geo, mat); m.castShadow=shadow!==false; parent.add(m);
  vcount+=geo.attributes.position.count;
  tcount+=(geo.index?geo.index.count:geo.attributes.position.count)/3;
  return m;
}

/* ---- 회전체 ---- */
function lathe(profile, seg, uOffset){
  var rings=[], i, j;
  for(i=0;i<profile.length;i++){ rings.push(profile[i]);
    if(profile[i][2] && i>0 && i<profile.length-1) rings.push(profile[i]); }
  var pos=[], uv=[], idx=[], acc=[0], tot=0;
  for(i=1;i<rings.length;i++){ tot+=Math.hypot(rings[i][0]-rings[i-1][0],rings[i][1]-rings[i-1][1]); acc.push(tot); }
  for(i=0;i<rings.length;i++){
    var r=rings[i][0], y=rings[i][1];
    for(j=0;j<=seg;j++){
      var u=j/seg, t=2*Math.PI*(u-(uOffset===undefined?0.5:uOffset));
      pos.push(r*Math.sin(t), y, r*Math.cos(t));
      uv.push(u, tot>0?acc[i]/tot:0);
    }
  }
  var row=seg+1;
  for(i=0;i<rings.length-1;i++){
    if(rings[i][0]===rings[i+1][0] && rings[i][1]===rings[i+1][1]) continue;
    for(j=0;j<seg;j++){ var v0=i*row+j; idx.push(v0,v0+row,v0+row+1, v0,v0+row+1,v0+1); }
  }
  var g=new T.BufferGeometry();
  g.setAttribute("position",new T.Float32BufferAttribute(pos,3));
  g.setAttribute("uv",new T.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}

add(body, lathe(PROFILE, 56), matPaint);

/* ---- 하부 부양 디스크 ---- */
var liftDisc = add(body, new T.CircleGeometry(0.110, 40), matLift, false);
liftDisc.position.y=-0.201; liftDisc.rotation.x=Math.PI/2;
var liftHalo = add(body, new T.CircleGeometry(0.190, 40), matHalo, false);
liftHalo.position.y=-0.215; liftHalo.rotation.x=Math.PI/2;
var liftLight = new T.PointLight(0x62d8ff, 1.4, 1.5, 2);
liftLight.position.set(0,-0.24,0); body.add(liftLight);

/* ============================================================
   4. 바이저
   ============================================================ */
function roundRectShape(w,h,r){
  var s=new T.Shape(), x=w/2, y=h/2;
  s.moveTo(-x+r,-y);
  s.lineTo(x-r,-y); s.quadraticCurveTo(x,-y,x,-y+r);
  s.lineTo(x,y-r);  s.quadraticCurveTo(x,y,x-r,y);
  s.lineTo(-x+r,y); s.quadraticCurveTo(-x,y,-x,y-r);
  s.lineTo(-x,-y+r);s.quadraticCurveTo(-x,-y,-x+r,-y);
  s.closePath(); return s;
}
var visor=new T.Group(); visor.position.set(0,0.048,0.140); body.add(visor);

var bezelShape=roundRectShape(0.268,0.148,0.050);
bezelShape.holes.push(roundRectShape(0.230,0.112,0.038));
add(visor, new T.ExtrudeGeometry(bezelShape,{depth:0.070, bevelEnabled:true,
  bevelThickness:0.004, bevelSize:0.004, bevelSegments:2, curveSegments:16}), matGraphite);
add(visor, new T.ExtrudeGeometry(roundRectShape(0.232,0.114,0.038),{depth:0.010,
  bevelEnabled:false, curveSegments:16}), matDark, false);

/* 디스플레이 */
var DW=512, DH=248;
var faceCv=cv(DW,DH), fx=faceCv.getContext("2d");
var faceTex=new T.CanvasTexture(faceCv); faceTex.encoding=T.sRGBEncoding;
var matFace=new T.MeshBasicMaterial({ map:faceTex, transparent:true });
var screen=add(visor, new T.PlaneGeometry(0.226,0.109), matFace, false);
screen.position.z=0.014;

var glass=add(visor, new T.ExtrudeGeometry(roundRectShape(0.234,0.116,0.038),
  {depth:0.005, bevelEnabled:false, curveSegments:16}), matGlass, false);
glass.position.z=0.062;

/* 바이저 위 상태 LED */
var topLed = add(body, new T.BoxGeometry(0.016,0.008,0.006), matCy, false);
topLed.position.set(0,0.132,0.184); topLed.rotation.x=-0.42;
/* 정면 우하단 포인트 LED + 눈금 */
var dotLed = add(body, new T.CircleGeometry(0.010,16), matCy, false);
dotLed.position.set(0.062,-0.068,0.199); dotLed.lookAt(0.30,-0.30,1.2);
(function(){
  var d=add(body, new T.BoxGeometry(0.022,0.004,0.003), matGraphite, false);
  d.position.set(0.098,-0.068,0.184); d.rotation.y=-0.5;
})();

/* ============================================================
   5. 측면 포드 (후프 + 벤트 캡)
   ============================================================ */
var pods=[];
(function(){
  var hoop=roundRectShape(0.118,0.150,0.055);
  hoop.holes.push(roundRectShape(0.078,0.108,0.038));
  var hoopGeo=new T.ExtrudeGeometry(hoop,{depth:0.052, bevelEnabled:true,
    bevelThickness:0.005, bevelSize:0.005, bevelSegments:2, curveSegments:16});
  [-1,1].forEach(function(s){
    var g=new T.Group();
    g.position.set(s*0.176, 0.012, 0.006);
    g.rotation.y = s*Math.PI/2;
    body.add(g);
    add(g, hoopGeo, matPaint);
    /* 벤트 캡 */
    var cap=add(g, new T.CylinderGeometry(0.044,0.046,0.030,22), matGraphite, false);
    cap.position.z=0.040; cap.rotation.x=Math.PI/2;
    var ring=add(g, new T.TorusGeometry(0.046,0.005,6,26), matSteel, false);
    ring.position.z=0.052;
    /* 구멍 5개 */
    var hole=new T.CircleGeometry(0.0095,12);
    for(var k=0;k<4;k++){
      var a=k/4*Math.PI*2+0.78;
      var h=add(g, hole, matDark, false);
      h.position.set(0.021*Math.cos(a), 0.021*Math.sin(a), 0.056);
    }
    var hc=add(g, hole, matDark, false); hc.position.set(0,0,0.056);
    /* 후프 안쪽 슬릿 발광 */
    var slit=add(g, new T.BoxGeometry(0.004,0.030,0.003), matCyDim, false);
    slit.position.set(0,0.062,0.030);
    pods.push(g);
  });
})();

/* ============================================================
   6. 후면 디테일 + 안테나
   ============================================================ */
var backLeds=[];
(function(){
  var led=new T.BoxGeometry(0.013,0.008,0.005);
  for(var k=0;k<5;k++){

})();
(function(){
  var m=add(body, new T.CylinderGeometry(0.0035,0.0055,0.090,10), matGraphite);
  m.position.set(0,0.248,-0.020); m.rotation.x=0.16;
  var t=add(body, new T.SphereGeometry(0.006,10,8), matSteel, false);
  t.position.set(0,0.292,-0.027);
})();

/* ============================================================
   7. 무대 조명
   ============================================================ */
var floor=new T.Mesh(new T.PlaneGeometry(30,30),
  new T.MeshStandardMaterial({color:0x121517, roughness:0.86, metalness:0.12}));
floor.rotation.x=-Math.PI/2; floor.position.y=-0.95; floor.receiveShadow=true; scene.add(floor);

var amb=new T.AmbientLight(0x1a2229,0.72); scene.add(amb);
var key=new T.DirectionalLight(0xe6eef5,1.25); key.position.set(2.0,3.2,2.4);
key.castShadow=true; key.shadow.mapSize.set(1024,1024);
key.shadow.camera.near=0.5; key.shadow.camera.far=12; scene.add(key);
var rimA=new T.DirectionalLight(0x63a9ff,1.6); rimA.position.set(-2.8,1.0,-2.6); scene.add(rimA);
var rimB=new T.DirectionalLight(0xffb27a,0.7); rimB.position.set(2.6,0.2,-2.6); scene.add(rimB);

var shipLights=[key,rimA,rimB,bounce];

var spot=new T.SpotLight(0xffeacb,2.6,12,0.66,0.5,1.5);
spot.castShadow=true; spot.shadow.mapSize.set(1024,1024);
var spotTarget=new T.Object3D(); scene.add(spot); scene.add(spotTarget); spot.target=spotTarget;
var beam=new T.Mesh(new T.ConeGeometry(1,1,28,1,true),
  new T.MeshBasicMaterial({color:0xffdcaa,transparent:true,opacity:0.035,side:T.DoubleSide,depthWrite:false}));
scene.add(beam);

/* ============================================================
   8. 디스플레이 — 시트의 10종
   ============================================================ */
var CX=DW/2, CY=DH/2, CYAN="#69dbff", RED="#ff5a4a";
function begin(dim){
  fx.clearRect(0,0,DW,DH);
  fx.save();
  fx.beginPath();
  var r=44, x=4, y=4, w=DW-8, h=DH-8;
  fx.moveTo(x+r,y); fx.lineTo(x+w-r,y); fx.quadraticCurveTo(x+w,y,x+w,y+r);
  fx.lineTo(x+w,y+h-r); fx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  fx.lineTo(x+r,y+h); fx.quadraticCurveTo(x,y+h,x,y+h-r);
  fx.lineTo(x,y+r); fx.quadraticCurveTo(x,y,x+r,y); fx.closePath();
  fx.clip();
  fx.fillStyle="#04080b"; fx.fillRect(0,0,DW,DH);
  fx.globalAlpha = dim===undefined?1:dim;
}
function end(){
  fx.globalAlpha=1;
  fx.fillStyle="rgba(0,0,0,.26)";
  for(var y=0;y<DH;y+=3) fx.fillRect(0,y,DW,1);
  fx.restore(); faceTex.needsUpdate=true;
}
function glow(c){ fx.shadowColor=c||CYAN; fx.shadowBlur=18; fx.fillStyle=c||CYAN; fx.strokeStyle=c||CYAN; }

function eyes(w,h,dim){
  glow(); fx.globalAlpha = dim===undefined?1:dim;
  [-1,1].forEach(function(s){ fx.fillRect(CX+s*54-w/2, CY-h/2, w, h); });
  fx.globalAlpha=1; fx.shadowBlur=0;
}

var DISPLAYS = {
  idle:      { label:"기본 상태",     draw:function(t){ begin(); eyes(30,30); end(); } },
  scan:      { label:"스캔 중",       draw:function(t){ begin(); glow();
                 fx.font="600 44px ui-monospace,monospace"; fx.textAlign="center";
                 fx.fillText("-- SCAN --", CX, CY+16);
                 fx.globalAlpha=0.35; fx.fillRect(20, CY+40+Math.sin(t*3)*22, DW-40, 3);
                 fx.globalAlpha=1; fx.shadowBlur=0; end(); } },
  calc:      { label:"계산 중",       draw:function(t){ begin(); glow();
                 for(var k=0;k<3;k++){
                   fx.globalAlpha = ((Math.floor(t*3)%3)===k)?1:0.28;
                   fx.fillRect(CX-56+k*46, CY-11, 22, 22); }
                 fx.globalAlpha=1; fx.shadowBlur=0; end(); } },
  pulse:     { label:"맥박 확인",     draw:function(t){ begin(); glow();
                 fx.lineWidth=5; fx.lineJoin="round"; fx.beginPath();
                 var ph=(t*0.8)%1;
                 for(var i=0;i<=120;i++){
                   var x=i/120, px=30+x*(DW-60), d=((x-ph)+1)%1, yy=CY;
                   if(d>0.44&&d<0.47) yy=CY+16; else if(d>=0.47&&d<0.50) yy=CY-52;
                   else if(d>=0.50&&d<0.53) yy=CY+30; else if(d>=0.53&&d<0.56) yy=CY-6;
                   if(i===0) fx.moveTo(px,yy); else fx.lineTo(px,yy);
                 }
                 fx.stroke(); fx.shadowBlur=0; end(); } },
  count:     { label:"숫자 카운트",   draw:function(t){ begin(); glow();
                 fx.font="600 74px ui-monospace,monospace"; fx.textAlign="center";
                 fx.fillText((88+Math.floor(t*4)%9)+"", CX+40, CY+26);
                 fx.font="600 40px ui-monospace,monospace"; fx.globalAlpha=0.55;
                 fx.fillText("2", CX-96, CY+22); fx.globalAlpha=1; fx.shadowBlur=0; end(); } },
  warn:      { label:"위험 감지",     draw:function(t){ begin(); glow(RED);
                 fx.globalAlpha = 0.45+0.55*Math.abs(Math.sin(t*4));
                 fx.lineWidth=7; fx.lineJoin="round"; fx.beginPath();
                 fx.moveTo(CX,CY-46); fx.lineTo(CX+50,CY+40); fx.lineTo(CX-50,CY+40);
                 fx.closePath(); fx.stroke();
                 fx.fillRect(CX-4,CY-14,8,30); fx.fillRect(CX-4,CY+22,8,8);
                 fx.globalAlpha=1; fx.shadowBlur=0; end(); } },
  power:     { label:"잔량 표시",     draw:function(t){ begin(); glow();
                 fx.font="600 52px ui-monospace,monospace"; fx.textAlign="left";
                 fx.fillText("17%", CX-140, CY+18);
                 fx.lineWidth=4; fx.strokeRect(CX+16, CY-24, 106, 46);
                 fx.fillRect(CX+124, CY-10, 8, 20);
                 fx.globalAlpha=0.9; fx.fillRect(CX+22, CY-18, 18, 34);
                 fx.globalAlpha=1; fx.shadowBlur=0; end(); } },
  door:      { label:"문 제어 중",    draw:function(t){ begin(); glow();
                 fx.font="600 46px ui-monospace,monospace"; fx.textAlign="center";
                 fx.fillText("OPEN", CX, CY+16);
                 var o=Math.sin(t*4)*8;
                 fx.beginPath(); fx.moveTo(CX-104-o,CY); fx.lineTo(CX-78-o,CY-18);
                 fx.lineTo(CX-78-o,CY+18); fx.closePath(); fx.fill();
                 fx.beginPath(); fx.moveTo(CX+104+o,CY); fx.lineTo(CX+78+o,CY-18);
                 fx.lineTo(CX+78+o,CY+18); fx.closePath(); fx.fill();
                 fx.shadowBlur=0; end(); } },
  countdown: { label:"카운트다운",    draw:function(t){ begin(); glow();
                 var n=Math.max(0,90-Math.floor(t));
                 fx.font="600 92px ui-monospace,monospace"; fx.textAlign="center";
                 fx.globalAlpha=(t%1)<0.16?1:0.72;
                 fx.fillText(n+"", CX, CY+32);
                 fx.globalAlpha=1; fx.shadowBlur=0; end(); } },
  dying:     { label:"전력 종료 직전", draw:function(t){ begin(); eyes(20,20,0.30); end(); } }
};
var DISP_ROW1=["idle","scan","calc","pulse","count"];
var DISP_ROW2=["warn","power","door","countdown","dying"];

/* ============================================================
   9. 상태
   ============================================================ */
var L={ pos:new T.Vector3(), vel:new T.Vector3(), target:new T.Vector3(),
        yaw:0,pitch:0,roll:0,yawV:0,pitchV:0, bobT:0, t:0,
        lift:1, sag:0, hold:0, light:1, moving:false,
        disp:"idle", seq:-1 };

function wrapPi(a){ while(a>Math.PI)a-=6.283185; while(a<-Math.PI)a+=6.283185; return a; }
function sdamp(cur,goal,o,k,sm,dt){
  var w=2/Math.max(sm,1e-4), x=w*dt, ex=1/(1+x+0.48*x*x+0.235*x*x*x);
  var ch=wrapPi(cur-goal), tmp=(o[k]+w*ch)*dt;
  o[k]=(o[k]-w*tmp)*ex; return goal+(ch+tmp)*ex;
}
var wander=0, ORIGIN=new T.Vector3(), tmpV=new T.Vector3(), fwd=new T.Vector3(), lensPos=new T.Vector3();

/* 엔딩 시퀀스: 시트의 5단계 */
var SEQ=[
  { at:0.0,  disp:"idle",      light:1, lift:1, tag:"1. 도킹 시작" },
  { at:2.0,  disp:"connected", light:1, lift:1, tag:"2. 접속 완료" },
  { at:4.2,  disp:"connected", light:0, lift:1, tag:"3. 라이트 소등" },
  { at:6.2,  disp:"fading",    light:0, lift:0, tag:"4. 디스플레이 어두워짐" },
  { at:8.4,  disp:"lastled",   light:0, lift:0, tag:"5. 마지막 상태 LED 점멸" }
];
function drawSeq(stage, st){
  if(stage==="connected"){
    begin(); eyes(30,30);
    glow(); for(var k=0;k<5;k++){
      fx.globalAlpha = (st*6%5|0)===k ? 1 : 0.35;
      fx.fillRect(CX-58+k*26, CY+56, 16, 7); }
    fx.globalAlpha=1; fx.shadowBlur=0; end();
  } else if(stage==="fading"){
    var d=clamp(1-st/2.0, 0.04, 1);
    begin(); eyes(22,22, d*0.5); end();
  } else if(stage==="lastled"){
    begin(); glow();
    fx.globalAlpha=(st%1.4)<0.16?0.95:0.04;
    fx.beginPath(); fx.arc(CX, CY+58, 7, 0, 6.283); fx.fill();
    fx.globalAlpha=1; fx.shadowBlur=0; end();
  }
}

function update(dt){
  L.t+=dt;
  var wantLight=1, wantLift=1, seqStage=null, seqLocal=0, tag=null;

  if(L.seq>=0){
    L.seq+=dt;
    var s=SEQ[0], i;
    for(i=0;i<SEQ.length;i++) if(L.seq>=SEQ[i].at) s=SEQ[i];
    wantLight=s.light; wantLift=s.lift; seqStage=s.disp;
    seqLocal=L.seq-s.at; tag=s.tag;
    if(L.seq>14) L.seq=0;
  }

  if(L.moving && L.seq<0){
    wander+=dt;
    L.target.set(Math.sin(wander*0.55)*0.55, Math.sin(wander*0.31)*0.12, Math.cos(wander*0.42)*0.35);
    ["x","y","z"].forEach(function(ax){
      L.vel[ax]+=(L.target[ax]-L.pos[ax])*6*dt;
      L.vel[ax]*=Math.pow(0.06,dt);
      L.vel[ax]=clamp(L.vel[ax],-1.2,1.2);
      L.pos[ax]+=L.vel[ax]*dt; });
  } else {
    ["x","y","z"].forEach(function(ax){ L.vel[ax]*=Math.pow(0.02,dt); });
    L.pos.lerp(ORIGIN, 1-Math.pow(0.15,dt));
  }

  if(L.hold>0){ L.hold-=dt; wantLift=0; }
  L.lift=lerp(L.lift, wantLift, 1-Math.pow(0.004,dt));
  L.sag =lerp(L.sag, (1-L.lift)*0.085, 1-Math.pow(0.02,dt));
  L.light=lerp(L.light, wantLight, 1-Math.pow(0.0015,dt));

  L.bobT+=dt;
  var bob=(0.026*Math.sin(L.bobT*2.62)+0.007*Math.sin(L.bobT*3.70))*L.lift - L.sag;

  var dx=camera.position.x-L.pos.x, dy=camera.position.y-(L.pos.y+bob), dz=camera.position.z-L.pos.z;
  L.yaw  = sdamp(L.yaw,  Math.atan2(dx,dz), L,"yawV", 0.20, dt);
  L.pitch= sdamp(L.pitch,-Math.atan2(dy,Math.hypot(dx,dz)), L,"pitchV", 0.24, dt);
  var rv=L.vel.x*Math.cos(L.yaw)-L.vel.z*Math.sin(L.yaw);
  L.roll=lerp(L.roll, clamp(-rv*0.30,-0.32,0.32), 1-Math.pow(0.001,dt));

  rig.position.set(L.pos.x, L.pos.y+bob, L.pos.z);
  body.rotation.set(L.pitch, L.yaw, L.roll, "YXZ");

  /* 발광 갱신 */
  matLift.opacity=0.95*L.lift;
  matHalo.opacity=0.30*L.lift;
  liftLight.intensity=1.4*L.lift;
  liftDisc.visible=liftHalo.visible=L.lift>0.01;
  matCy.color.setRGB(0.38*L.light, 0.85*L.light, 1.0*L.light);
  matCyDim.color.setRGB(0.18*L.lift, 0.50*L.lift, 0.62*L.lift);
  matFace.opacity = 1;

  if(seqStage) drawSeq(seqStage, seqLocal);
  else DISPLAYS[L.disp].draw(L.t);

  fwd.set(0,0,1).applyEuler(body.rotation);
  lensPos.set(0,0.048,0.20).applyEuler(body.rotation).add(rig.position);
  spot.position.copy(lensPos);
  spotTarget.position.copy(lensPos).addScaledVector(fwd,6);
  spot.intensity=2.6*L.light;
  beam.visible=L.light>0.03;
  if(beam.visible){
    var reach=4.5, r=Math.tan(spot.angle)*reach;
    beam.scale.set(r,reach,r);
    beam.position.copy(lensPos).addScaledVector(fwd,reach/2);
    beam.quaternion.setFromUnitVectors(tmpV.set(0,-1,0), fwd);
    beam.material.opacity=0.035*L.light;
  }
  return tag;
}

/* ============================================================
   10. 카메라 · UI
   ============================================================ */
var orbit={theta:0.42, phi:1.46, dist:1.05, auto:true};
function placeCamera(){
  camera.position.set(
    orbit.dist*Math.sin(orbit.phi)*Math.sin(orbit.theta),
    orbit.dist*Math.cos(orbit.phi),
    orbit.dist*Math.sin(orbit.phi)*Math.cos(orbit.theta));
  camera.lookAt(0,0.01,0);
}
var dragging=false,lx=0,ly=0;
stage.addEventListener("pointerdown",function(e){ dragging=true; lx=e.clientX; ly=e.clientY;
  stage.classList.add("dragging"); stage.setPointerCapture(e.pointerId); });
stage.addEventListener("pointermove",function(e){ if(!dragging)return;
  orbit.theta-=(e.clientX-lx)*0.008;
  orbit.phi=clamp(orbit.phi-(e.clientY-ly)*0.008,0.35,2.6);
  lx=e.clientX; ly=e.clientY; });
stage.addEventListener("pointerup",function(e){ dragging=false;
  stage.classList.remove("dragging"); stage.releasePointerCapture(e.pointerId); });
stage.addEventListener("wheel",function(e){ e.preventDefault();
  orbit.dist=clamp(orbit.dist+e.deltaY*0.0012,0.5,4.0); },{passive:false});

var allDispBtns=[];
function mkRow(rowId, keys){
  var el=document.getElementById(rowId);
  keys.forEach(function(k){
    var b=document.createElement("button");
    b.textContent=DISPLAYS[k].label;
    b.setAttribute("aria-pressed", k===L.disp?"true":"false");
    b.addEventListener("click",function(){
      L.disp=k; L.seq=-1; L.t=0;
      allDispBtns.forEach(function(o){ o.setAttribute("aria-pressed", o===b?"true":"false"); });
      document.getElementById("r-state").textContent=DISPLAYS[k].label;
    });
    el.appendChild(b); allDispBtns.push(b);
  });
}
mkRow("row1", DISP_ROW1); mkRow("row2", DISP_ROW2);

document.getElementById("ending").addEventListener("click",function(){
  L.seq=0; allDispBtns.forEach(function(o){ o.setAttribute("aria-pressed","false"); }); });
document.getElementById("silence").addEventListener("click",function(){ L.hold=0.5; });
var moveBtn=document.getElementById("moving");
moveBtn.addEventListener("click",function(){
  L.moving=!L.moving; moveBtn.setAttribute("aria-pressed", L.moving?"true":"false"); });
var spinBtn=document.getElementById("spin");
spinBtn.addEventListener("click",function(){ orbit.auto=!orbit.auto;
  spinBtn.setAttribute("aria-pressed", orbit.auto?"true":"false"); });
var wireBtn=document.getElementById("wire");
wireBtn.addEventListener("click",function(){
  var on=wireBtn.getAttribute("aria-pressed")!=="true";
  wireBtn.setAttribute("aria-pressed", on?"true":"false");
  [matPaint,matGraphite,matDark,matSteel].forEach(function(m){ m.wireframe=on; }); });
var lightBtn=document.getElementById("lights");
lightBtn.addEventListener("click",function(){
  var off=lightBtn.getAttribute("aria-pressed")!=="true";
  lightBtn.setAttribute("aria-pressed", off?"true":"false");
  shipLights.forEach(function(l){ l.visible=!off; });
  amb.intensity= off?0.10:0.72; });

document.getElementById("r-verts").textContent=vcount.toLocaleString();
document.getElementById("r-tris").textContent=Math.round(tcount).toLocaleString();
document.getElementById("r-state").textContent="기본 상태";

window.addEventListener("resize",function(){
  W=stage.clientWidth; H=stage.clientHeight;
  camera.aspect=W/H; camera.updateProjectionMatrix(); renderer.setSize(W,H); });

var prev=performance.now(), acc=0;
var rLift=document.getElementById("r-lift"), rState=document.getElementById("r-state");
function frame(now){
  var dt=Math.min((now-prev)/1000,0.05); prev=now;
  if(orbit.auto && !dragging) orbit.theta+=dt*0.15;
  placeCamera();
  var tag=update(dt);
  acc+=dt;
  if(acc>0.12){ acc=0;
    rLift.textContent=Math.round(L.lift*100)+"%";
    if(tag) rState.textContent=tag; }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
placeCamera(); requestAnimationFrame(frame);
})();
</script>
